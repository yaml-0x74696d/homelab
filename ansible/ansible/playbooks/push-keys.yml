---
- name: Push ssh keys to cluster
  hosts: all:!appliances
  become: false

  # follow: on pve root's authorized_keys links into /etc/pve/priv, shared by the cluster
  tasks:
    - name: Add public key to authorized_keys
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        state: present
        follow: true
        key: "{{ lookup('file', admin_ssh_pubkey_file | expanduser) }}"

    - name: Add semaphore's key
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        state: present
        follow: true
        key: "{{ semaphore_ssh_pubkey }}"
      when: semaphore_ssh_pubkey | default('') | length > 0
