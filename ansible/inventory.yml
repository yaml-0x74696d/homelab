all:
  children:
    lxc_containers:
      hosts:
        storage:
          ansible_host: "{{ storage_ip }}"
        log:
          ansible_host: "{{ log_ip }}"
        iot:
          ansible_host: "{{ iot_lan_ip }}"
    proxmox:
      hosts:
        pve-1:
          ansible_host: "{{ pve1_ip }}"
        pve-2:
          ansible_host: "{{ pve2_ip }}"
        pve-3:
          ansible_host: "{{ pve3_ip }}"
    netbird_agent:
      # always-on lan box that routes the lan for netbird peers.
      # pod-1 left after netbird's dns grabbed :53 from pi-hole there. pod-2 keeps
      # netbird dns management off, dns-relay answers the vpn clients on 1053.
      # members stay in their primary group (pod_vms/proxmox) for connection vars.
      hosts:
        pod-2:   # routing peer
    pod_vms:
      # the app vms, rootless podman only
      hosts:
        pod-1:
          ansible_host: "{{ pod1_ip }}"
        pod-2:
          ansible_host: "{{ pod2_ip }}"
        pod-3:
          ansible_host: "{{ pod3_ip }}"
    podman_hosts:
      # podman on bare metal, outside tofu
      hosts:
        ctl-1:
          ansible_host: "{{ ctl1_ip }}"
    appliances:
      # vms ansible never logs in to (haos): only here so apps.yml can name them as a host
      hosts:
        haos:
          ansible_host: "{{ haos_ip }}"
