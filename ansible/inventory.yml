all:
  children:
    lxc_containers:
      hosts:
        storage:
          ansible_host: "{{ storage_ip }}"
        log:
          ansible_host: "{{ log_ip }}"
        iot:
          ansible_host: "{{ iot_lan_ip }}"
    docker_hosts:
      hosts:
        docker-1:
          ansible_host: "{{ docker1_ip }}"
        docker-2:
          ansible_host: "{{ docker2_ip }}"
        docker-3:
          ansible_host: "{{ docker3_ip }}"
    proxmox:
      hosts:
        pve-1:
          ansible_host: "{{ pve1_ip }}"
        pve-2:
          ansible_host: "{{ pve2_ip }}"
        pve-3:
          ansible_host: "{{ pve3_ip }}"
    netbird_agent:
      # always-on lan box that routes the lan for netbird peers.
      # docker-1 left after netbird's dns grabbed :53 from pihole there; pihole now
      # runs on docker-2 with netbird dns management off for that group.
      # members stay in their primary group (docker_hosts/proxmox) for connection vars.
      hosts:
        docker-2:   # routing peer
