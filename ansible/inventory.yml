all:
  children:
    lxc_containers:
      hosts:
        storage:
          ansible_host: "{{ storage_ip }}"
        log:
          ansible_host: "{{ log_ip }}"
        iot:
          ansible_host: "{{ iot_lan_ip }}"
    docker_hosts:
      hosts:
        pod-1:
          ansible_host: "{{ pod1_ip }}"
        pod-2:
          ansible_host: "{{ pod2_ip }}"
    proxmox:
      hosts:
        pve-1:
          ansible_host: "{{ pve1_ip }}"
        pve-2:
          ansible_host: "{{ pve2_ip }}"
        pve-3:
          ansible_host: "{{ pve3_ip }}"
    netbird_agent:
      # always-on lan box that routes the lan for netbird peers.
      # pod-1 left after netbird's dns grabbed :53 from pihole there; pihole now
      # runs on pod-2 with netbird dns management off for that group.
      # members stay in their primary group (docker_hosts/pod_vms/proxmox) for connection vars.
      hosts:
        pod-2:   # routing peer
    pod_vms:
      # vms with podman only, docker is gone. same base as docker_hosts
      hosts:
        pod-3:
          ansible_host: "{{ pod3_ip }}"
    podman_hosts:
      # podman without docker. bare metal, outside tofu
      hosts:
        ctl-1:
          ansible_host: "{{ ctl1_ip }}"
    appliances:
      # vms ansible never logs in to (haos): only here so apps.yml can name them as a host
      hosts:
        haos:
          ansible_host: "{{ haos_ip }}"
