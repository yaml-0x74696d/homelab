http:
  middlewares:
    # authentik forward-auth, domain-level. gate browser UIs behind sso:
    # unauth'd requests get bounced to auth.<domain>, the cookie is good for the whole zone.
    # reaches the embedded outpost in the authentik-server container directly on proxy-net.
    # NB: needs a proxy provider (mode: forward auth / domain level) assigned to the embedded outpost first.
    authentik:
      forwardAuth:
        address: "http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt
          - X-authentik-meta-jwks
          - X-authentik-meta-outpost
          - X-authentik-meta-provider
          - X-authentik-meta-app
          - X-authentik-meta-version
