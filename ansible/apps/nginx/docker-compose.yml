services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "${PORT}:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true
