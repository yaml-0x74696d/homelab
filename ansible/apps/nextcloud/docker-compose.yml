services:
  db:
    image: postgres:${PG_TAG}
    container_name: nextcloud-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: ${HEALTH_START}
      interval: ${HEALTH_INTERVAL}
      retries: ${HEALTH_RETRIES}
      timeout: ${DB_HEALTH_TIMEOUT}
    volumes:
      - ./database:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${PG_PASS}
    networks:
      - nextcloud-internal

  redis:
    image: redis:alpine
    container_name: nextcloud-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      start_period: ${HEALTH_START}
      interval: ${HEALTH_INTERVAL}
      retries: ${HEALTH_RETRIES}
      timeout: ${REDIS_HEALTH_TIMEOUT}
    networks:
      - nextcloud-internal

  app:
    image: nextcloud:apache
    container_name: nextcloud
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./html:/var/www/html
      # user data on the pool (cifs)
      - ${DATA_PATH}:/data
      # other apps' shares, added as external storage inside nextcloud
      - ${SHARES_ROOT}/nc-media:/external/media
      - ${SHARES_ROOT}/nc-documents:/external/documents
      - ${SHARES_ROOT}/nc-photos:/external/photos:ro
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${PG_PASS}
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: ${NC_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NC_ADMIN_PASS}
      NEXTCLOUD_DATA_DIR: /data
      NEXTCLOUD_TRUSTED_DOMAINS: cloud.${DOMAIN}
      OVERWRITEPROTOCOL: https
      OVERWRITECLIURL: https://cloud.${DOMAIN}
      # only traefik (docker-1) may set X-Forwarded-For
      TRUSTED_PROXIES: ${DOCKER1_IP}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT}
      PHP_UPLOAD_LIMIT: ${PHP_UPLOAD_LIMIT}
    # reach auth.<domain> (traefik on docker-1) directly; container dns can't resolve it
    extra_hosts:
      - "auth.${DOMAIN}:${DOCKER1_IP}"
    # docker-3: traefik can't see this host's labels. publish a port and route
    # via the file provider (traefik/dynamic/remote_services.yml)
    ports:
      - "${PORT}:80"
    networks:
      - nextcloud-internal   # private db/redis comms
      - proxy-net             # normal bridge so the published port can bind

networks:
  proxy-net:
    external: true
  nextcloud-internal:
    internal: true
