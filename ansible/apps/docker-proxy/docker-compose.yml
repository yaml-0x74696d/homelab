services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-proxy
    restart: unless-stopped
    labels:
      - "homelab.docker-sock=true"   # restarted after dockerd restarts (vm-preparation)
    environment:
      - CONTAINERS=1
      - INFO=1
      - NETWORKS=1
      - SERVICES=1
      - METRICS=1
    ports:
      - "${PORT}:2375"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
