services:
  vaultwarden:
    image: vaultwarden/server:${VAULTWARDEN_TAG}
    container_name: vaultwarden
    ports:
      - "${PORT}:80"   # edge routes it
    restart: unless-stopped
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - SIGNUPS_ALLOWED=${SIGNUPS_ALLOWED}
      - DOMAIN=https://vault.${DOMAIN}
      - SSO_ENABLED=true
      - SSO_AUTHORITY=${SSO_AUTHORITY}
      - SSO_CLIENT_ID=${SSO_CLIENT_ID}
      - SSO_CLIENT_SECRET=${SSO_CLIENT_SECRET}
      - SSO_SCOPES=${SSO_SCOPES}
      # vault only via authentik (deliberate; authentik down = no new logins)
      - SSO_ONLY=true
      - INVITATIONS_ALLOWED=false
      - PASSWORD_HINTS_ALLOWED=false
    volumes:
      - ./data:/data
    networks:
      - proxy-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.rule=Host(`vault.${DOMAIN}`)"
      - "traefik.http.routers.vaultwarden.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden.tls=true"
      - "traefik.http.routers.vaultwarden.tls.certresolver=cloudflare"
      - "traefik.http.routers.vaultwarden.service=vaultwarden"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"
      # /admin behind authentik too (longer rule wins); clients never call it
      - "traefik.http.routers.vaultwarden-admin.rule=Host(`vault.${DOMAIN}`) && PathPrefix(`/admin`)"
      - "traefik.http.routers.vaultwarden-admin.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden-admin.tls=true"
      - "traefik.http.routers.vaultwarden-admin.tls.certresolver=cloudflare"
      - "traefik.http.routers.vaultwarden-admin.middlewares=authentik@file"
      - "traefik.http.routers.vaultwarden-admin.service=vaultwarden"

networks:
  proxy-net:
    external: true
