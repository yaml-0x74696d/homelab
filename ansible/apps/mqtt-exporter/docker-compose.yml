services:
  mqtt-exporter:
    image: kpetrem/mqtt-exporter:latest
    container_name: mqtt-exporter
    restart: unless-stopped
    ports:
      - "${PORT}:${PORT}"
    environment:
      - MQTT_ADDRESS=${MQTT_ADDRESS}
      - MQTT_PORT=${MQTT_PORT}
      - PROMETHEUS_PORT=${PORT}
      - LOG_LEVEL=${LOG_LEVEL}
