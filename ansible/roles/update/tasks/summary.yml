---
# runs once on the controller after all hosts. ntfy gets counts only, paths stay in the terminal
- name: Collect results
  ansible.builtin.set_fact:
    # results only, not the whole hostvars (facts)
    update_done: >-
      {{ update_summary_hosts | map('extract', hostvars) | selectattr('update_result', 'defined')
         | map(attribute='update_result') | list }}

- name: Details per host
  ansible.builtin.debug:
    msg:
      restarted: "{{ item.restarted }}"
      still_stale: "{{ item.stale }}"
      new_conffiles: "{{ item.conffiles }}"
  loop: "{{ update_done }}"
  loop_control:
    label: "{{ item.host }}"
  when: (item.stale + item.conffiles + item.restarted) | length > 0

- name: Summary
  vars:
    update_lines: |-
      {% for r in update_done %}
      {{ r.host }}: {{ r.packages }} pkgs, {{ r.restarted | length }} restarted
      {{- ', REBOOT due' if r.reboot }}
      {{- ', %d stale' % (r.stale | length) if r.stale }}
      {{- ', %d new conffiles' % (r.conffiles | length) if r.conffiles }}, aide {{ r.aide }}
      {% endfor %}
  when: update_done | length > 0   # nobody finished: the failure alert says it all
  block:
    - name: Print summary
      ansible.builtin.debug:
        msg: "{{ update_lines | default('', true) | split('\n') }}"

    - name: Push summary
      ansible.builtin.uri:
        url: "{{ ntfy_url }}"
        method: POST
        body: "{{ update_lines }}"
        headers: "{{ update_ntfy_headers }}"
        timeout: "{{ ntfy_timeout }}"
      delegate_to: localhost   # also runs from the rescue on a failed host
      become: false
      no_log: true   # bearer token in the headers
      when: ntfy_url | default('') | length > 0
