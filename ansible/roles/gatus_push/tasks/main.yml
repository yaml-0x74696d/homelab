---
# one heartbeat per run, from the first host left. a host that failed earlier leaves ansible_play_hosts short, so a bad run pushes nothing
# on the gatus host itself: its port only lets in the lab hosts, not the controller
- name: Push the heartbeat of {{ gatus_push_job }}
  ansible.builtin.uri:
    url: "http://localhost:{{ apps.gatus.port }}/api/v1/endpoints/{{ gatus_push_group }}_semaphore-{{ gatus_push_job }}/external?success=true"
    method: POST
    headers:
      Authorization: "Bearer {{ gatus_push_token }}"
    timeout: "{{ gatus_push_timeout }}"
  delegate_to: "{{ apps.gatus.host }}"
  run_once: true
  changed_when: false
  no_log: true
  when:
    - not ansible_check_mode
    - ansible_play_hosts | length == ansible_play_hosts_all | length
