---
argument_specs:
  main:
    short_description: Heartbeat to gatus once a scheduled playbook went through
    options:
      gatus_push_path:
        type: str
        required: true
        description: Push path with {key} for the endpoint key (group_vars)
      gatus_push_job:
        type: str
        required: true
        description: Semaphore template name, the external endpoint is semaphore-<job> (gatus_semaphore_templates)
      gatus_push_group:
        type: str
        required: true
        description: Gatus endpoint group of the heartbeats (group_vars)
      gatus_push_timeout:
        type: int
        required: true
        description: Seconds the push may take (group_vars)
      gatus_push_token:
        type: str
        default: ""
        no_log: true
        description: Gatus push token (vault), empty = no push
