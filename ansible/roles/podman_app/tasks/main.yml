---
# argument_specs validates the entry but doesn't fill its defaults, hence the | default() below

- name: Check the entry of {{ podman_app_name }}
  ansible.builtin.assert:
    that:
      - podman_app_entry.runtime | default('podman') == 'podman'
      - podman_app_entry.state | default('present') == 'present'
      - inventory_hostname in podman_app_entry.hosts | default([podman_app_entry.host])
    fail_msg: "{{ podman_app_name }}: runtime compose, state absent/purged or wrong host"
    quiet: true

# a missing overlay would swap private files for public ones and drop the private-only ones as stale
- name: Check the private overlay dir
  ansible.builtin.assert:
    that: (podman_app_private_dir ~ '/apps') is directory
    fail_msg: "private_dir is set but {{ podman_app_private_dir }}/apps is missing (on semaphore: ctl-preparation.yml -l ctl-1 -t private-files)"
    quiet: true
  when: podman_app_private_dir | length > 0

# port, routes, tiles and firewall sources resolve the app to one host
- name: Check a multi-host entry of {{ podman_app_name }}
  ansible.builtin.assert:
    that:
      - podman_app_entry.port is undefined
      - podman_app_entry.extra_ports | default([]) | length == 0
      - podman_app_entry.routes | default([]) | length == 0
      - podman_app_entry.homepage is undefined
      - podman_app_entry.allow_from | length == 0
    fail_msg: "{{ podman_app_name }}: hosts: is only for apps nothing reaches (no port, routes, homepage, allow_from)"
    quiet: true
  when: podman_app_entry.hosts is defined

# still not built: per-app .network, init containers. absent/purged are refused above
- name: Check the containers of {{ podman_app_name }}
  ansible.builtin.assert:
    that:
      - podman_app_entry.containers | map(attribute='name') | unique | length == podman_app_entry.containers | length
      - podman_app_name in podman_app_entry.containers | map(attribute='name')
      - item.name == podman_app_name or item.name is match(podman_app_name ~ '-')
      - item.after | default([]) | difference(podman_app_entry.containers | map(attribute='name')) | length == 0
      - item.name not in item.after | default([])
      - item.cifs | default([]) | difference(podman_app_entry.cifs | default([]) | map(attribute='path')) | length == 0
      - podman_app_entry.container_uid | default(0) == 0 or item.user is defined
    fail_msg: "{{ podman_app_name }}/{{ item.name }}: duplicate name, no container named like the app, not <app>-<role>, after/cifs naming
      something the entry doesn't have, or keep-id without user"
    quiet: true
  loop: "{{ podman_app_entry.containers }}"
  loop_control:
    label: "{{ item.name }}"

- name: Check the cifs shares of {{ podman_app_name }}
  ansible.builtin.assert:
    that:
      - item.user in smb_passwords | default({})
      - podman_app_entry.cifs | map(attribute='path') | select('eq', item.path) | list | length == 1
      - item.path is not search('^/|\\.\\.')
      - (cifs_mount_root ~ '/' ~ item.path) is not match(podman_apps_root ~ '(/|$)')
    fail_msg: "{{ podman_app_name }}: cifs {{ item.path }} has no smb_passwords[{{ item.user }}], is listed twice,
      isn't a plain relative path or lands in {{ podman_apps_root }}"
    quiet: true
  loop: "{{ podman_app_entry.cifs | default([]) }}"
  loop_control:
    label: "{{ item.path }}"

- name: Check the secret sources of {{ podman_app_name }}
  ansible.builtin.assert:
    that: (item.vault is defined) != (item.template is defined)
    fail_msg: "{{ podman_app_name }}: secret {{ item.name }} needs exactly one of vault or template"
    quiet: true
  loop: "{{ podman_app_entry.secrets }}"
  loop_control:
    label: "{{ item.name }}"

- name: Check the unit templates for {{ podman_app_name }}
  ansible.builtin.stat:
    path: "{{ podman_app_src }}/{{ item.name }}.container.j2"
  loop: "{{ podman_app_entry.containers }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: localhost
  become: false
  register: podman_app_tpl_stat
  failed_when: not podman_app_tpl_stat.stat.exists

# ports, AddHost= and the network belong to the pod, podman refuses them on a pod's container
- name: Check the pod template for {{ podman_app_name }}
  ansible.builtin.stat:
    path: "{{ podman_app_src }}/{{ podman_app_name }}.pod.j2"
  delegate_to: localhost
  become: false
  register: podman_app_pod_stat
  failed_when: not podman_app_pod_stat.stat.exists
  when: podman_app_pod

- name: Check the allow_from names of {{ podman_app_name }}
  ansible.builtin.assert:
    that: item in app_sources or (item in apps and apps[item].host is defined)
    fail_msg: >-
      {{ podman_app_name }}: allow_from '{{ item }}'
      {{ 'is a multi-host app (hosts:), put the host you mean in app_sources' if item in apps
         else 'is neither in app_sources nor an app' }}
    quiet: true
  loop: "{{ (podman_app_entry.allow_from + podman_app_entry.extra_ports | default([]) | map(attribute='allow_from') | flatten) | unique }}"

- name: Resolve allow_from for {{ podman_app_name }}
  ansible.builtin.set_fact:
    podman_app_rules: "{{ (lookup('ansible.builtin.template', 'firewall-rules.j2') | from_yaml or []) | unique }}"

- name: Check the svc user {{ podman_app_user }}
  ansible.builtin.command: "id -u {{ podman_app_user }}"
  register: podman_app_user_before
  changed_when: false
  failed_when: false
  check_mode: false

# a first --check has no svc user yet, so the tasks that need it skip then
- name: Note if new user {{ podman_app_user }}
  ansible.builtin.set_fact:
    podman_app_user_new: "{{ podman_app_user_before.rc != 0 }}"

# before the user exists, else useradd adds a second, random range
- name: Reserve the subuid/subgid range of {{ podman_app_user }}
  ansible.builtin.lineinfile:
    path: "/etc/{{ item }}"
    regexp: "^{{ podman_app_user }}:"
    line: "{{ podman_app_user }}:{{ podman_app_entry.uid * podman_app_subid_count }}:{{ podman_app_subid_count }}"
    create: true
    mode: '0644'
  loop: [subuid, subgid]
  register: podman_app_subid

# rootless gets a device only through the svc user's groups (render for /dev/dri)
- name: Find the device groups of {{ podman_app_name }}
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ podman_app_entry.containers | map(attribute='devices', default=[]) | flatten | unique }}"
  register: podman_app_devices
  failed_when: not podman_app_devices.stat.exists

- name: Create group {{ podman_app_user }}
  ansible.builtin.group:
    name: "{{ podman_app_user }}"
    gid: "{{ podman_app_entry.uid }}"

- name: Create user {{ podman_app_user }}
  ansible.builtin.user:
    name: "{{ podman_app_user }}"
    uid: "{{ podman_app_entry.uid }}"
    group: "{{ podman_app_user }}"
    groups: "{{ [podman_svc_group] + podman_app_devices.results | default([]) | map(attribute='stat.gr_name') | unique }}"
    append: true
    home: "{{ podman_app_home }}"
    shell: /usr/sbin/nologin
    password: '!'
    password_lock: true

- name: Read the subid lines of {{ podman_app_user }}
  ansible.builtin.command: "grep -c '^{{ podman_app_user }}:' /etc/{{ item }}"
  loop: [subuid, subgid]
  register: podman_app_subid_count_out
  changed_when: false
  failed_when: podman_app_subid_count_out.stdout != '1'

- name: User env for {{ podman_app_name }}
  ansible.builtin.set_fact:
    podman_app_user_env:
      XDG_RUNTIME_DIR: "/run/user/{{ podman_app_entry.uid }}"
      DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ podman_app_entry.uid }}/bus"

- name: Enable linger for {{ podman_app_user }}
  ansible.builtin.command: "loginctl enable-linger {{ podman_app_user }}"
  args:
    creates: "/var/lib/systemd/linger/{{ podman_app_user }}"

- name: Start the user manager of {{ podman_app_user }}
  ansible.builtin.systemd_service:
    name: "user@{{ podman_app_entry.uid }}.service"
    state: started

# an existing user's storage still maps the old range until migrated
- name: Migrate podman storage to the new range for {{ podman_app_user }}
  ansible.builtin.command: podman system migrate
  become: true
  become_user: "{{ podman_app_user }}"
  environment: "{{ podman_app_user_env }}"
  when: podman_app_subid is changed and not podman_app_user_new
  changed_when: true

- name: Ensure the apps root
  ansible.builtin.file:
    path: "{{ podman_apps_root }}"
    state: directory
    mode: '0755'

# owner = a uid inside the container, mapped to the host id of the svc user's range. the app dir is then
# passable (0711) so that uid gets through it to its own dir without listing it.
# keep-id puts container_uid on svc-<name> and shifts the uids above it down by one
- name: Ensure data dirs for {{ podman_app_name }}
  ansible.builtin.file:
    path: "{{ podman_app_dir }}{{ ('/' + item.path) if item.path else '' }}"
    state: directory
    owner: "{{ podman_app_dir_owner }}"
    group: "{{ podman_app_dir_owner }}"
    mode: "{{ item.mode | default('0750') }}"
  vars:
    podman_app_cuid: "{{ podman_app_entry.container_uid | default(0) }}"
    podman_app_dir_uid: "{{ item.owner | default(podman_app_cuid) | int }}"
    podman_app_dir_owner: "{{ podman_app_user if podman_app_dir_uid | int == podman_app_cuid | int
                              else podman_app_entry.uid * podman_app_subid_count + podman_app_dir_uid | int
                                   - (1 if podman_app_dir_uid | int > podman_app_cuid | int else 0) }}"
  loop: "{{ [{'path': '', 'mode': '0711' if podman_app_entry.dirs | default([]) | selectattr('owner', 'defined') | list | length > 0 else '0750'}]
            + podman_app_entry.dirs | default([]) }}"
  loop_control:
    label: "{{ item.path or '.' }}"
  when: not (ansible_check_mode and podman_app_user_new)

# host mounts, not podman cifs volumes: rootless can't mount cifs. the creds file stays on the host for fstab
- name: Install cifs-utils for {{ podman_app_name }}
  ansible.builtin.apt:
    name: cifs-utils
    state: present
  when: podman_app_entry.cifs | default([]) | length > 0

- name: Ensure the cifs credentials dir
  ansible.builtin.file:
    path: "{{ podman_app_cifs_creds_dir }}"
    state: directory
    mode: '0700'
  when: podman_app_entry.cifs | default([]) | length > 0

- name: Write the cifs credentials of {{ podman_app_name }}
  ansible.builtin.copy:
    dest: "{{ podman_app_cifs_creds_dir }}/{{ item.share }}.creds"
    mode: '0600'
    content: |
      username={{ item.user }}
      password={{ smb_passwords[item.user] }}
  loop: "{{ podman_app_entry.cifs | default([]) }}"
  loop_control:
    label: "{{ item.share }}"
  no_log: true
  diff: false

# uid/gid = svc-<name>: root in the container, or container_uid with keep-id.
# present, not mounted: x-systemd.automount mounts it on first access, and again after a drop
- name: Pool shares in fstab for {{ podman_app_name }}
  ansible.posix.mount:
    path: "{{ cifs_mount_root }}/{{ item.path }}"
    src: "//{{ storage_ip }}/{{ item.share }}"
    fstype: cifs
    opts: "{{ (['credentials=' ~ podman_app_cifs_creds_dir ~ '/' ~ item.share ~ '.creds',
                'uid=' ~ podman_app_entry.uid, 'gid=' ~ podman_app_entry.uid,
                'file_mode=' ~ item.file_mode | default('0660'), 'dir_mode=' ~ item.dir_mode | default('0770'),
                'vers=' ~ podman_app_cifs_vers, 'mfsymlinks', 'nofail', '_netdev', 'x-systemd.automount']
               + item.opts | default([])) | join(',') }}"
    state: present
  loop: "{{ podman_app_entry.cifs | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  register: podman_app_fstab
  notify: Restart app

# fails while something still holds it (the docker app before its cutover)
- name: Unmount changed pool shares of {{ podman_app_name }}
  ansible.posix.mount:
    path: "{{ cifs_mount_root }}/{{ item.item.path }}"
    state: unmounted
  loop: "{{ podman_app_fstab.results | default([]) | selectattr('changed') }}"
  loop_control:
    label: "{{ item.item.path }}"

- name: Name the cifs automount units of {{ podman_app_name }}
  ansible.builtin.command: "systemd-escape --path --suffix=automount {{ cifs_mount_root }}/{{ item.path }}"
  loop: "{{ podman_app_entry.cifs | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  register: podman_app_automounts
  changed_when: false
  check_mode: false

- name: Start the cifs automounts of {{ podman_app_name }}
  ansible.builtin.systemd_service:
    name: "{{ item.stdout }}"
    state: started
    daemon_reload: "{{ podman_app_fstab is changed }}"   # the fstab generator makes the units
  loop: "{{ podman_app_automounts.results | default([]) }}"
  loop_control:
    label: "{{ item.stdout }}"
  # a fresh fstab line has no unit yet in --check
  when: not (ansible_check_mode and podman_app_fstab is changed)

- name: Ensure quadlet dirs for {{ podman_app_name }}
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ podman_app_user }}"
    group: "{{ podman_app_user }}"
    mode: '0750'
  loop: "{{ [podman_app_home + '/.config', podman_app_home + '/.config/containers', podman_app_quadlet_dir,
            podman_app_quadlet_dir + '/container.d']
            + ([podman_app_quadlet_dir + '/' + podman_app_name + '.pod.d'] if podman_app_pod else [])
            + podman_app_entry.containers | map(attribute='name') | map('regex_replace', '^(.*)$', podman_app_quadlet_dir + '/\\1.container.d') }}"
  when: not (ansible_check_mode and podman_app_user_new)

- name: House rules for {{ podman_app_name }}
  ansible.builtin.template:
    src: 10-homelab.conf.j2
    dest: "{{ podman_app_quadlet_dir }}/container.d/10-homelab.conf"
    owner: "{{ podman_app_user }}"
    group: "{{ podman_app_user }}"
    mode: '0640'
  notify: [Reload user units, Restart app]
  when: not (ansible_check_mode and podman_app_user_new)

- name: Map settings for {{ podman_app_name }}
  ansible.builtin.template:
    src: 50-map.conf.j2
    dest: "{{ podman_app_quadlet_dir }}/{{ item.name }}.container.d/50-map.conf"
    owner: "{{ podman_app_user }}"
    group: "{{ podman_app_user }}"
    mode: '0640'
  loop: "{{ podman_app_entry.containers }}"
  loop_control:
    label: "{{ item.name }}"
  notify: [Reload user units, Restart app]
  when: not (ansible_check_mode and podman_app_user_new)

- name: Unit files for {{ podman_app_name }}
  ansible.builtin.template:
    src: "{{ podman_app_src }}/{{ item.name }}.container.j2"
    dest: "{{ podman_app_quadlet_dir }}/{{ item.name }}.container"
    owner: "{{ podman_app_user }}"
    group: "{{ podman_app_user }}"
    mode: '0640'
  loop: "{{ podman_app_entry.containers }}"
  loop_control:
    label: "{{ item.name }}"
  notify: [Reload user units, Restart app]
  when: not (ansible_check_mode and podman_app_user_new)

- name: Pod map settings for {{ podman_app_name }}
  ansible.builtin.template:
    src: 50-pod.conf.j2
    dest: "{{ podman_app_quadlet_dir }}/{{ podman_app_name }}.pod.d/50-map.conf"
    owner: "{{ podman_app_user }}"
    group: "{{ podman_app_user }}"
    mode: '0640'
  notify: [Reload user units, Restart app]
  when: podman_app_pod and not (ansible_check_mode and podman_app_user_new)

- name: Pod file for {{ podman_app_name }}
  ansible.builtin.template:
    src: "{{ podman_app_src }}/{{ podman_app_name }}.pod.j2"
    dest: "{{ podman_app_quadlet_dir }}/{{ podman_app_name }}.pod"
    owner: "{{ podman_app_user }}"
    group: "{{ podman_app_user }}"
    mode: '0640'
  notify: [Reload user units, Restart app]
  when: podman_app_pod and not (ansible_check_mode and podman_app_user_new)

# apps/<name>/config/ mirrors <app dir>/config/. root-owned so the app can't rewrite it, world-readable
# because workers often run as a non-root uid (lands on a subuid = "other"). secrets go into podman secrets
- name: Mirror the config dirs of {{ podman_app_name }}
  ansible.builtin.file:
    path: "{{ podman_app_dir }}/config/{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop: "{{ [{'path': ''}] + podman_app_config | selectattr('state', 'eq', 'directory') }}"
  loop_control:
    label: "{{ item.path or '.' }}"
  when: podman_app_config | length > 0 and not (ansible_check_mode and podman_app_user_new)

- name: Copy the config files of {{ podman_app_name }}
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ podman_app_dir }}/config/{{ item.path }}"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ podman_app_config_own | selectattr('state', 'eq', 'file') | rejectattr('path', 'search', '\\.j2$') }}"
  loop_control:
    label: "{{ item.path }}"
  notify: Restart app
  when: not (ansible_check_mode and podman_app_user_new)

# private_dir overlay: copied as is, never shown in --diff
- name: Copy the private config files of {{ podman_app_name }}
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ podman_app_dir }}/config/{{ item.path }}"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ podman_app_config_private | selectattr('state', 'eq', 'file') }}"
  loop_control:
    label: "{{ item.path }}"
  diff: false
  notify: Restart app
  when: not (ansible_check_mode and podman_app_user_new)

- name: Render the config templates of {{ podman_app_name }}
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ podman_app_dir }}/config/{{ item.path | regex_replace('\\.j2$', '') }}"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ podman_app_config_own | selectattr('state', 'eq', 'file') | selectattr('path', 'search', '\\.j2$') }}"
  loop_control:
    label: "{{ item.path }}"
  notify: Restart app
  when: not (ansible_check_mode and podman_app_user_new)

- name: Find config files on the host for {{ podman_app_name }}
  ansible.builtin.find:
    paths: "{{ podman_app_dir }}/config"
    file_type: any
    recurse: true
    hidden: true
  register: podman_app_config_live
  when: podman_app_config | length > 0

# a file deleted from the repo goes on the host too
- name: Drop stale config of {{ podman_app_name }}
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ podman_app_config_live.files | default([]) | map(attribute='path') | map('relpath', podman_app_dir ~ '/config')
            | difference(podman_app_config | map(attribute='path') | map('regex_replace', '\\.j2$', ''))
            | map('regex_replace', '^', podman_app_dir ~ '/config/') | sort | reverse }}"
  notify: Restart app
  when: podman_app_config | length > 0

- name: Read the ufw rules
  ansible.builtin.command: ufw status
  register: podman_app_ufw_status
  changed_when: false
  check_mode: false

# rules this app had before (comment 'podman <app>') that aren't wanted anymore
- name: Find stale ufw rules of {{ podman_app_name }}
  ansible.builtin.set_fact:
    podman_app_ufw_stale: "{{ lookup('ansible.builtin.template', 'ufw-stale.j2') | from_yaml or [] }}"

- name: Drop stale ufw rules of {{ podman_app_name }}
  community.general.ufw:
    rule: allow
    port: "{{ item.port | string }}"
    proto: "{{ item.proto }}"
    from_ip: "{{ item.src }}"
    delete: true
  loop: "{{ podman_app_ufw_stale }}"

- name: Allow ports in ufw for {{ podman_app_name }}
  community.general.ufw:
    rule: allow
    port: "{{ item.port | string }}"
    proto: "{{ item.proto }}"
    from_ip: "{{ item.src }}"
    comment: "podman {{ podman_app_name }}"
  loop: "{{ podman_app_rules }}"

- name: Render the secrets of {{ podman_app_name }}
  ansible.builtin.set_fact:
    podman_app_secret_data: >-
      {{ podman_app_secret_data | default({}) | combine({item.name:
         lookup('ansible.builtin.template', podman_app_src + '/' + item.template) if item.template is defined
         else lookup('ansible.builtin.vars', item.vault)}) }}
  loop: "{{ podman_app_entry.secrets }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

# compares the real content, no hash label
- name: Read the current secrets of {{ podman_app_name }}
  ansible.builtin.command: "podman secret inspect --showsecret --format {{ '{{.SecretData}}' }} {{ item.name }}"
  loop: "{{ podman_app_entry.secrets }}"
  loop_control:
    label: "{{ item.name }}"
  become: true
  become_user: "{{ podman_app_user }}"
  environment: "{{ podman_app_user_env }}"
  register: podman_app_secret_current
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true
  when: not (ansible_check_mode and podman_app_user_new)

- name: Create or replace the secrets of {{ podman_app_name }}
  ansible.builtin.command: "podman secret create --replace {{ item.item.name }} -"
  args:
    stdin: "{{ podman_app_secret_data[item.item.name] }}"
    stdin_add_newline: false
  loop: "{{ podman_app_secret_current.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default('') }}"
  become: true
  become_user: "{{ podman_app_user }}"
  environment: "{{ podman_app_user_env }}"
  when:
    - item.rc is defined
    - item.rc != 0 or item.stdout | trim != podman_app_secret_data[item.item.name] | trim
  changed_when: true
  notify: Restart app
  no_log: true

# command is skipped in check mode, so --check would never show a secret change
- name: Secrets that would change for {{ podman_app_name }}
  ansible.builtin.debug:
    msg: "{{ item.item.name }} would be replaced"
  loop: "{{ podman_app_secret_current.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default('') }}"
  when:
    - ansible_check_mode
    - item.rc is defined
    - item.rc != 0 or item.stdout | trim != podman_app_secret_data[item.item.name] | trim
  changed_when: true
  notify: Restart app
  no_log: true

# so the image pull doesn't eat TimeoutStartSec
- name: Pull images for {{ podman_app_name }}
  ansible.builtin.shell: "podman image exists {{ item.image }}:{{ item.tag }} || podman pull -q {{ item.image }}:{{ item.tag }}"
  loop: "{{ podman_app_entry.containers }}"
  loop_control:
    label: "{{ item.image }}:{{ item.tag }}"
  become: true
  become_user: "{{ podman_app_user }}"
  environment: "{{ podman_app_user_env }}"
  register: podman_app_pull
  changed_when: podman_app_pull.stdout | length > 0
  when: not (ansible_check_mode and podman_app_user_new)

- name: Apply unit changes
  ansible.builtin.meta: flush_handlers

# quadlets can't be enabled, WantedBy=default.target starts them at boot
- name: Start {{ podman_app_name }}
  ansible.builtin.systemd_service:
    name: "{{ item.name }}.service"
    state: started
    scope: user
  loop: "{{ podman_app_entry.containers }}"
  loop_control:
    label: "{{ item.name }}"
  become: true
  become_user: "{{ podman_app_user }}"
  environment: "{{ podman_app_user_env }}"
  when: not (ansible_check_mode and podman_app_user_new)

- name: Enable auto-update for {{ podman_app_user }}
  ansible.builtin.systemd_service:
    name: podman-auto-update.timer
    state: started
    enabled: true
    scope: user
  become: true
  become_user: "{{ podman_app_user }}"
  environment: "{{ podman_app_user_env }}"
  when: not (ansible_check_mode and podman_app_user_new)

- name: Drop old images of {{ podman_app_name }}
  ansible.builtin.command: podman image prune -af
  become: true
  become_user: "{{ podman_app_user }}"
  environment: "{{ podman_app_user_env }}"
  register: podman_app_prune
  changed_when: podman_app_prune.stdout | length > 0
  when: not (ansible_check_mode and podman_app_user_new)
