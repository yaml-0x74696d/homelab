---
- name: Reload user units
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ podman_app_user }}"
  environment: "{{ podman_app_user_env }}"
  when: not (ansible_check_mode and podman_app_user_new)

# a pod restarts as a whole: its containers are bound to <name>-pod.service, the start task brings them back.
# expects the pod stop to take its containers down (BindsTo=), so a pod change gets a fresh pod
- name: Restart app
  ansible.builtin.systemd_service:
    name: "{{ item }}.service"
    state: restarted
    scope: user
  loop: "{{ [podman_app_name + '-pod'] if podman_app_pod else podman_app_entry.containers | map(attribute='name') }}"
  become: true
  become_user: "{{ podman_app_user }}"
  environment: "{{ podman_app_user_env }}"
  when: not (ansible_check_mode and podman_app_user_new)
