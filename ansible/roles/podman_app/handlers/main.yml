---
- name: Reload user units
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ podman_app_user }}"
  environment: "{{ podman_app_user_env }}"
  when: not (ansible_check_mode and podman_app_user_result is changed)

- name: Restart app
  ansible.builtin.systemd_service:
    name: "{{ item.name }}.service"
    state: restarted
    scope: user
  loop: "{{ podman_app_entry.containers }}"
  loop_control:
    label: "{{ item.name }}"
  become: true
  become_user: "{{ podman_app_user }}"
  environment: "{{ podman_app_user_env }}"
  when: not (ansible_check_mode and podman_app_user_result is changed)
