---
# path to the app's source dir on the control node
docker_app_src: "{{ playbook_dir }}/../apps/{{ docker_app_name }}"
# private overlay outside the repo, <private_dir>/apps/<name>/, laid over the app dir after the copy
docker_app_private_src: "{{ (private_dir | expanduser ~ '/apps/' ~ docker_app_name) if private_dir | default('') else '' }}"
docker_app_root: "{{ apps_root }}"

# extra dirs to create under <root>/<app>, e.g. [{path: data, owner: '472'}]
docker_app_dirs: []
# every routed app joins proxy-net; ensure it per-host (compose declares it external)
docker_app_networks: [proxy-net]
# files to create empty if missing, e.g. [{path: acme.json, mode: '0600'}]
docker_app_touch: []
# ufw allow rules, e.g. [{port: 1883}]
docker_app_ufw: []
# cifs mounts from the samba pool, e.g. [{share: nextcloud, user: nextcloud, path: /srv/nextcloud, uid: 33, gid: 33}]
docker_app_cifs: []
docker_app_cifs_vers: "3.1.1"   # smb dialect for the pool mounts
# containers to restart when config changes, e.g. [homepage]
docker_app_restart: []
# templates that hold secrets besides .env (paths relative to the app dir, with .j2): rendered without --diff
docker_app_secret_templates: []
# every .env.j2 plus those, relative to the app dir (read after the template search in tasks/main.yml)
docker_app_secret_rel: "{{ docker_app_tpls.files | map(attribute='path') | map('relpath', docker_app_src)
                           | select('search', '(^|/)\\.env\\.j2$') | list + docker_app_secret_templates }}"
# docker_compose_v2 options
docker_app_compose_state: present
docker_app_compose_pull: policy
docker_app_compose_remove_orphans: false
# podman_app's unit templates share apps/<name>/ during the migration; never rendered here
docker_app_quadlet_files: ["*.container.j2", "*.pod.j2", "*.network.j2", "*.volume.j2"]
