---
argument_specs:
  main:
    short_description: Network, ufw and repo access on ctl-1
    options:
      ctl_base_iface:
        type: str
        description: The LAN interface
      ctl_base_connection:
        type: str
        description: NetworkManager profile name
      ctl_base_ip:
        type: str
        description: Static address, prefix from lan_cidr
      ctl_base_dns:
        type: list
        elements: str
        description: Resolvers, in the profile
      ctl_base_repo_dir:
        type: path
        description: Git clone Semaphore runs from
      ctl_base_repo_url:
        type: str
        description: Repo to clone
      ctl_base_repo_version:
        type: str
        description: Branch of the first clone, repo-pull.yml keeps following it
      ctl_base_repo_gid:
        type: int
        description: Gid that may read the repo (svc-semaphore's)
      ctl_base_private_files:
        type: list
        elements: str
        description: Gitignored files copied from the controller's checkout, relative to the repo root
