---
# ctl-1: the host that runs semaphore (Debian arm64). vm_base + podman_base do the rest
ctl_base_iface: eth0
ctl_base_connection: lan   # networkmanager profile; replaces the in-memory "Wired connection 1"
ctl_base_ip: "{{ ctl1_ip }}"
# only internet names: hosts go by ip, auth.<domain> is pinned in the quadlet
ctl_base_dns: ["{{ gateway_ip }}"]
# git clone semaphore runs from (apps/semaphore), readable by its svc group. repo-pull.yml keeps it current
ctl_base_repo_dir: "{{ semaphore_repo_dir }}"
ctl_base_repo_url: "{{ semaphore_repo_url }}"
ctl_base_repo_version: "{{ semaphore_repo_version }}"
ctl_base_repo_gid: "{{ apps['semaphore'].uid }}"   # = svc-semaphore's gid, may not exist yet
# gitignored, so copied from the controller's checkout. paths relative to the repo root
ctl_base_private_files:
  - ansible/group_vars/all/vault.yml
  - ansible/group_vars/all/private/private.yml
# the controller's overlays (<private_dir>/apps), synced both ways with syncthing and mounted into semaphore.
# only apps/ goes over: the vault password, keys and tofu state stay in the secure storage on the controller
ctl_base_private_dir: "{{ semaphore_private_dir }}"
ctl_base_private_excludes: [.git]   # syncthing's .stignore
# ansible.cfg's vault_password_file has to exist. the real password comes from semaphore's key store, ansible tries both
ctl_base_vault_pass_dummy: ansible/.vault_pass

# syncthing with ctl-0 (tasks/syncthing.yml). empty peer id: syncthing runs, but no device or folders yet
ctl_base_syncthing_peer_id: "{{ syncthing_ctl0_id | default('') }}"   # private.yml, `syncthing device-id` on ctl-0
ctl_base_syncthing_home: "/home/{{ admin_user }}/.local/state/syncthing"
ctl_base_syncthing_api: http://127.0.0.1:8384/rest
ctl_base_syncthing_start_timeout: 60
ctl_base_syncthing_aide_dir: "{{ podman_apps_root }}/semaphore/aide"
# semaphore's container user (1001) on the host: subuid start + 1000, see roles/podman_app
ctl_base_semaphore_uid: "{{ apps['semaphore'].uid * 65536 + 1000 }}"
