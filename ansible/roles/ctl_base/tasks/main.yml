---
# no reload: the address would move under the running play. takes over at the next boot
- name: Static address
  ansible.builtin.template:
    src: lan.nmconnection.j2
    dest: "/etc/NetworkManager/system-connections/{{ ctl_base_connection }}.nmconnection"
    mode: "0600"

- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Default ufw policies
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }

# app ports come from roles/podman_app
- name: Ssh + node-exporter
  community.general.ufw:
    rule: "{{ item.rule }}"
    port: "{{ item.port }}"
    proto: tcp
    src: "{{ item.src }}"
    direction: in
  loop:
    - { rule: limit, port: "{{ ssh_port }}", src: "{{ lan_cidr }}" }
    - { rule: allow, port: "{{ node_exporter_port }}", src: "{{ prometheus_ip }}" }

- name: Enable ufw
  community.general.ufw:
    state: enabled

- name: Repo dir
  ansible.builtin.file:
    path: "{{ ctl_base_repo_dir }}"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0750"

# by gid, so it works before deploy-app.yml creates the group
- name: Svc group may pass the home dir
  ansible.posix.acl:
    path: "{{ ctl_base_repo_dir | dirname }}"
    etype: group
    entity: "{{ ctl_base_repo_gid }}"
    permissions: x
    state: present

# again on every run: rsync -p keeps the source's 0600 and masks the acl
- name: Svc group may read the repo
  ansible.posix.acl:
    path: "{{ ctl_base_repo_dir }}"
    etype: group
    entity: "{{ ctl_base_repo_gid }}"
    permissions: rX
    default: "{{ item }}"
    recursive: true
    state: present
  loop: [false, true]
