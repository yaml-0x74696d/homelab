---
# must match what's live, a re-run flips it
pve_firewall_cluster_enabled: true    # master switch; on = netbird gets filtered
pve_firewall_host_enabled: false      # pve host mgmt lockdown (the lockout-risk layer)

pve_firewall_lan_cidr: "{{ lan_cidr }}"
pve_firewall_gateway_ip: "{{ gateway_ip }}"

# the netbird routing peers — the netbird vm must reach these FULLY (turn relay uses
# arbitrary ports). rest of the lan stays dropped.
pve_firewall_routing_peers: "{{ groups['netbird_agent'] | map('extract', hostvars, 'ansible_host') | list }}"

# lan hosts the netbird vm only needs dns + https on: traefik (authentik, gitea) + the pihole service ip
pve_firewall_netbird_dns_https: ["{{ docker1_ip }}", "{{ dns_ip }}"]

# ssh (22) to the pve hosts — real shells only
pve_firewall_ssh_hosts: "{{ admin_hosts }}"

# web ui (8006) — admins, ui-only devices + the infra callers (homepage widget, gatus)
pve_firewall_ui_hosts: >-
  {{ admin_hosts + admin_ui_hosts + [{'ip': docker1_ip, 'c': 'homepage widget'},
     {'ip': hostvars[apps['gatus'].host].ansible_host, 'c': 'gatus'}] }}

# cluster mesh (corosync / migration between nodes)
pve_firewall_node_ips: ["{{ pve1_ip }}", "{{ pve2_ip }}", "{{ pve3_ip }}"]

# the wan-exposed netbird vm
pve_firewall_netbird_vmid: "{{ vmids.netbird }}"
pve_firewall_netbird_relay_range: "{{ netbird_relay_ports.min }}:{{ netbird_relay_ports.max }}"
pve_firewall_netbird_turn_ports: [3478, 5349]          # stun/turn + turns, tcp+udp

# the log lxc: relp in only from these
pve_firewall_log_vmid: "{{ vmids.log }}"
pve_firewall_log_ip: "{{ log_ip }}"
pve_firewall_log_port: "{{ log_relp_port }}"
pve_firewall_log_sources: ["{{ docker1_ip }}", "{{ docker2_ip }}", "{{ docker3_ip }}", "{{ storage_ip }}", "{{ iot_lan_ip }}", "{{ netbird_ip }}"]

# who scrapes node-exporter (log + iot lxc) and the mqtt exporter (iot lxc)
pve_firewall_prometheus_ip: "{{ prometheus_ip }}"

# the iot gateway lxc: inbound = its ufw (playbooks/deploy-iot.yml), both from app_settings.yml
pve_firewall_iot_vmid: "{{ vmids.iot }}"
pve_firewall_iot_cidr: "{{ iot_cidr }}"
pve_firewall_iot_nic: net1                      # the ct's leg on the iot bridge (tofu/lxc.tf, eth1)
pve_firewall_iot_mqtt_clients: "{{ mqtt_lan_clients }}"
pve_firewall_iot_net_ports: "{{ iot_net_ports }}"

# guests that must stay UNfiltered: their nic firewall bit is on, so the master switch
# would default-DROP them unless we drop an explicit "enable: 0" per guest.
# PRE-FLIGHT: add every other vmid that shows firewall=1 or it breaks.
pve_firewall_open_guests: ["{{ vmids.docker1 }}", "{{ vmids.docker2 }}", "{{ vmids.docker3 }}", "{{ vmids.storage }}"]
