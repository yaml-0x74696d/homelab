---
- name: Install cronie
  ansible.builtin.apt:
    name: cronie
    state: present
    update_cache: true

# --check doesn't install the package, so the unit doesn't exist yet
- name: Enable cronie
  ansible.builtin.systemd:
    name: cronie
    state: started
    enabled: true
  ignore_errors: "{{ ansible_check_mode }}"
