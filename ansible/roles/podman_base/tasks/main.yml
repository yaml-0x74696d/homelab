---
- name: Install podman
  ansible.builtin.apt:
    name: "{{ podman_base_packages }}"
    state: present
    update_cache: true

- name: Fail on ambiguous short image names
  ansible.builtin.copy:
    dest: /etc/containers/registries.conf.d/50-short-name-mode.conf
    mode: '0644'
    content: |
      short-name-mode = "enforcing"

- name: Create the svc users' group
  ansible.builtin.group:
    name: "{{ podman_svc_group }}"
    system: true

- name: Write the ntfy env file
  ansible.builtin.template:
    src: podman-ntfy.env.j2
    dest: "{{ podman_base_ntfy_env }}"
    owner: root
    group: "{{ podman_svc_group }}"
    mode: '0640'
  no_log: true

- name: Install the auto-update wrapper
  ansible.builtin.template:
    src: podman-auto-update-ntfy.sh.j2
    dest: "{{ podman_base_wrapper }}"
    mode: '0755'

- name: Install the apps helper
  ansible.builtin.template:
    src: apps.sh.j2
    dest: "{{ podman_base_apps_helper }}"
    mode: '0755'

- name: Ensure user unit drop-in dirs
  ansible.builtin.file:
    path: "/etc/systemd/user/{{ item }}.d"
    state: directory
    mode: '0755'
  loop:
    - podman-auto-update.timer
    - podman-auto-update.service

# empty OnCalendar= first, else upstream's daily stays as a second trigger
- name: Set the auto-update time for every user
  ansible.builtin.copy:
    dest: /etc/systemd/user/podman-auto-update.timer.d/schedule.conf
    mode: '0644'
    content: |
      [Timer]
      OnCalendar=
      OnCalendar={{ podman_base_auto_update_time }}

- name: Run auto-update through the wrapper
  ansible.builtin.copy:
    dest: /etc/systemd/user/podman-auto-update.service.d/ntfy.conf
    mode: '0644'
    content: |
      [Service]
      EnvironmentFile={{ podman_base_ntfy_env }}
      ExecStart=
      ExecStart={{ podman_base_wrapper }}

# auto-update keeps a tag fresh, this says when a pinned tag has a newer version
- name: Install the new-tags check
  ansible.builtin.template:
    src: podman-new-tags.sh.j2
    dest: "{{ podman_base_new_tags }}"
    mode: '0755'

- name: Install the new-tags units
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    mode: '0644'
    content: "{{ item.content }}"
  loop:
    - name: podman-new-tags.service
      content: |
        [Unit]
        Description=Newer tags of the podman app images
        Wants=network-online.target
        After=network-online.target

        [Service]
        Type=oneshot
        EnvironmentFile={{ podman_base_ntfy_env }}
        ExecStart={{ podman_base_new_tags }}
        ProtectSystem=full
        ProtectHome=read-only
        PrivateTmp=true
        NoNewPrivileges=true
    - name: podman-new-tags.timer
      content: |
        [Unit]
        Description=Weekly check for newer podman app image tags

        [Timer]
        OnCalendar={{ podman_base_new_tags_time }}
        RandomizedDelaySec=15min
        Persistent=true

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"
  register: podman_base_new_tags_units

- name: Enable the new-tags timer
  ansible.builtin.systemd_service:
    name: podman-new-tags.timer
    enabled: true
    state: started
    daemon_reload: "{{ podman_base_new_tags_units is changed }}"
  # a fresh unit file doesn't exist yet in --check
  when: not (ansible_check_mode and podman_base_new_tags_units is changed)
