---
# one host. aide's verify + accept tasks do the hash handling, same as aide-accept.yml.
# a hash mismatch fails the host and the run, as everywhere. anything else in here is recorded as an error and the run goes on
- name: Verify recorded db hash
  ansible.builtin.include_role:
    name: aide
    tasks_from: verify
    public: true   # aide_db + the role's dials

- name: No baseline on {{ inventory_hostname }}
  ansible.builtin.debug:
    msg: "no /var/lib/aide/aide.db, run playbooks/aide.yml first. skipping"
  when: not aide_db.stat.exists

- name: Skip {{ inventory_hostname }}
  ansible.builtin.meta: end_host
  when: not aide_db.stat.exists

- name: Auto-accept on {{ inventory_hostname }}
  block:
    # the daily check or update.yml would fight our scan for the aide lock
    - name: Pause aide-check timer on {{ inventory_hostname }}
      ansible.builtin.systemd:
        name: aide-check.timer
        state: stopped

    - name: Wait for a running aide check on {{ inventory_hostname }}
      ansible.builtin.systemd_service:
        name: aide-check.service
      register: aide_auto_accept_busy
      failed_when: aide_auto_accept_busy.status.ActiveState in ['active', 'activating']   # still busy after all retries
      until: aide_auto_accept_busy.status.ActiveState not in ['active', 'activating']
      retries: "{{ aide_auto_accept_wait_retries }}"
      delay: "{{ aide_auto_accept_wait_delay }}"

    # one scan gives the report and the new db. read-only apart from aide.db.new, so also in --check
    - name: Diff against baseline on {{ inventory_hostname }}
      ansible.builtin.command: aide --config=/etc/aide/aide.conf --update
      register: aide_auto_accept_update
      failed_when: aide_auto_accept_update.rc >= 14
      changed_when: false
      check_mode: false
      async: "{{ aide_run_timeout }}"
      poll: "{{ aide_run_poll }}"

    # the checker is read from files/ and run with -c: nothing is left on the host.
    # --since: the accept time on the controller, next to the hash. missing = the checker refuses
    - name: Check the changes on {{ inventory_hostname }}
      vars:
        aide_auto_accept_since: "{{ lookup('ansible.builtin.file', aide_checksum_dir ~ '/' ~ inventory_hostname ~ '.accepted', errors='ignore') | trim }}"
      ansible.builtin.command:
        argv: >-
          {{ [ansible_python_interpreter, '-c', lookup('ansible.builtin.file', 'aide-auto-accept-check'),
              '--since=' ~ aide_auto_accept_since, '--max-paths', aide_auto_accept_max_paths | string]
             + (['--removed-ok'] if aide_auto_accept_removed else [])
             + aide_auto_accept_ignore | map('regex_replace', '^', '--ignore=') | list }}
      args:
        stdin: "{{ aide_auto_accept_update.stdout }}"
      register: aide_auto_accept_report
      changed_when: false
      check_mode: false
      when: aide_auto_accept_update.rc != 0

    - name: Swap in new baseline on {{ inventory_hostname }}
      ansible.builtin.include_role:
        name: aide
        tasks_from: accept
      when:
        - aide_auto_accept_update.rc != 0
        - (aide_auto_accept_report.stdout | from_json).accept

    - name: Record result for {{ inventory_hostname }}
      vars:
        aide_auto_accept_check: >-
          {{ (aide_auto_accept_report.stdout | from_json) if aide_auto_accept_update.rc != 0
             else {'accept': false, 'reasons': [], 'paths': 0, 'packages': []} }}
      ansible.builtin.set_fact:
        aide_auto_accept_result:
          host: "{{ inventory_hostname }}"
          state: "{{ 'clean' if aide_auto_accept_update.rc == 0 else 'accepted' if aide_auto_accept_check.accept else 'review' }}"
          paths: "{{ aide_auto_accept_check.paths }}"
          packages: "{{ aide_auto_accept_check.packages }}"
          reasons: "{{ aide_auto_accept_check.reasons }}"

  rescue:
    - name: Record the error for {{ inventory_hostname }}
      ansible.builtin.set_fact:
        aide_auto_accept_result:
          host: "{{ inventory_hostname }}"
          state: error
          paths: 0
          packages: []
          reasons: ["'{{ ansible_failed_task.name }}' failed: {{ ansible_failed_result.msg | default('see the task log') }}"]

  always:
    - name: Resume aide-check timer on {{ inventory_hostname }}
      ansible.builtin.systemd:
        name: aide-check.timer
        state: started
