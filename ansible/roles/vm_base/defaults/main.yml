---
vm_base_packages:
  - auditd
  - libpam-pwquality
  - curl
  - gnupg
  - ca-certificates
  - fail2ban
  - apparmor
  - apparmor-utils
  - unattended-upgrades
  - needrestart

# 1 strict, 2 loose: a routing peer needs 2 (asymmetric paths through the tunnel)
vm_base_rp_filter: 1
# debian 13 no longer reads /etc/sysctl.conf at boot, only sysctl.d
vm_base_sysctl_file: /etc/sysctl.d/90-vm-base.conf
vm_base_sysctl:
  net.ipv4.tcp_syncookies: 1
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.all.rp_filter: "{{ vm_base_rp_filter }}"
  kernel.randomize_va_space: 2
  fs.suid_dumpable: 0
  net.ipv4.conf.all.log_martians: 1
  net.ipv6.conf.all.disable_ipv6: 1
  net.ipv6.conf.default.disable_ipv6: 1
  kernel.kptr_restrict: 2

vm_base_services:
  - auditd
  - fail2ban
  - apparmor
  - prometheus-node-exporter

# off on bare metal (ctl-1): no hypervisor to talk to, no ram for a web console
vm_base_guest_agent: true
vm_base_cockpit: true
# behind the edge proxy: websocket origins cockpit accepts, header carrying the proxy's scheme
vm_base_cockpit_origins: ["https://{{ inventory_hostname }}.{{ domain }}"]
vm_base_cockpit_protocol_header: X-Forwarded-Proto
