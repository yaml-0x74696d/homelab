---
# security origins only, no reboot. lxc_base uses it too (tasks_from)
- name: Write 50unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    mode: '0644'
    content: |
      Unattended-Upgrade::Origins-Pattern {
          "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
      };
      Unattended-Upgrade::Package-Blacklist { };
      Unattended-Upgrade::AutoFixInterruptedDpkg "true";
      Unattended-Upgrade::MinimalSteps "true";
      Unattended-Upgrade::InstallOnShutdown "false";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "false";

# a pattern that matches no source installs nothing, without any error
- name: Read apt sources
  ansible.builtin.command: apt-cache policy
  register: vm_base_apt_policy
  changed_when: false
  check_mode: false

- name: Check a Debian-Security source exists
  ansible.builtin.assert:
    that: vm_base_apt_policy.stdout is search('n=[a-z]+-security,l=Debian-Security')
    fail_msg: no Debian-Security source, unattended-upgrades would install nothing
    quiet: true
