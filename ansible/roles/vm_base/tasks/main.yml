---
- name: Install hardened package set
  ansible.builtin.apt:
    name: "{{ vm_base_packages }}"
    state: present
    update_cache: true

- name: Configure unattended-upgrades
  ansible.builtin.include_tasks: unattended_upgrades.yml

- name: Configure sysctl
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: true
  loop: "{{ vm_base_sysctl | dict2items }}"

- name: Set login banner
  ansible.builtin.copy:
    dest: "{{ item }}"
    content: "{{ login_banner_text }}"
    mode: '0644'
  loop:
    - /etc/issue
    - /etc/issue.net

- name: Harden sshd configuration
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
    validate: /usr/sbin/sshd -t -f %s
  loop:
    - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin no' }
    - { regexp: '^#?X11Forwarding', line: 'X11Forwarding no' }
    - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication no' }
    - { regexp: '^#?MaxAuthTries', line: 'MaxAuthTries {{ ssh_max_auth_tries }}' }
    - { regexp: '^#?ClientAliveInterval', line: 'ClientAliveInterval {{ ssh_client_alive_interval }}' }
    - { regexp: '^#?ClientAliveCountMax', line: 'ClientAliveCountMax {{ ssh_client_alive_count_max }}' }
  notify: Restart sshd

- name: Configure auditd rules
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/hardened.rules
    mode: '0640'
    content: |
      -w /etc/shadow -p wa -k shadow_changes
      -w /etc/passwd -p wa -k passwd_changes
      -w /etc/sudoers -p wa -k sudo_changes
      -w /etc/ssh/sshd_config -p wa -k sshd_changes
  notify: Restart auditd

- name: Set timezone
  community.general.timezone: { name: "{{ timezone }}" }

- name: Enable and start services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: "{{ vm_base_services }}"
