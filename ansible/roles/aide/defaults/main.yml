---
# schedule: aide_check_time / aide_check_delay in group_vars hosts.yml (shared with nixos)
aide_check_nice: 19
aide_check_io_class: idle

# --init / --update hash the whole system: time limit + poll, in seconds
aide_run_timeout: 3600
aide_run_poll: 30
aide_report_lines: 150   # diff lines shown by aide-accept.yml

# accepted db hashes, one <host>.sha256 each. ansible/aide is a symlink into the offsite-synced private folder
aide_checksum_dir: "{{ playbook_dir }}/../aide"

# churn on every host. /var/log: every line is on the log lxc already, that copy is the tamper protection
aide_excludes_common:
  - /run                                # tmpfs, rebuilt on boot and daemon-reload
  - /tmp/ansible_[^/]+                  # ansible module payloads
  - /root/.ansible
  - /root/.ansible_async
  - "/home/{{ admin_user }}/.ansible"
  - "/home/{{ admin_user }}/.cache"
  - /root/.cache
  - /var/lib/aide/aide.db.new           # written during --update, gone after the accept
  - /var/log
  - /var/lib/rsyslog                    # read position, queue
  - /var/cache/apt
  - /var/lib/apt/lists
  - /var/lib/PackageKit
  - /var/lib/prometheus/node-exporter   # textfile collectors

# interactive logins: history files may change, owner/mode/type stay watched (debian's VarFile/VarDir,
# its own example in 31_aide_root-dotfiles). .ssh and the rc files keep the full rule
aide_login_homes: ["/home/{{ admin_user }}", /root]
aide_history_files: '\\.(bash_history|lesshst|viminfo|python_history|wget-hsts)'

# rewritten by design (timer runs, apt's daily stamps, dhcp renewals): VarFile like debian's own rules
aide_var_files:
  - '/var/lib/systemd/timers/stamp-[^/]+\\.timer'
  - '/home/{{ podman_svc_prefix }}[^/]+/\\.local/share/systemd/timers/stamp-[^/]+\\.timer'
  - '/var/lib/apt/periodic/[^/]+'
  - '/var/lib/NetworkManager/[^/]+\\.lease'
  - '/var/lib/NetworkManager/seen-bssids'
  - '/var/lib/misc/dnsmasq\\.leases'

# rewritten with the same content (cloud-init's /etc/hosts at boot, netbird on restart): owner, mode + checksum, no times
aide_content_files:
  - /etc/hosts
  - /etc/ssh/ssh_config.d/99-netbird\\.conf
  - /var/lib/netbird/state\\.json

# dirs whose files get replaced (new mtime), owner + mode stay watched
aide_var_dirs:
  - /etc/apt/apt.conf.d
  - /etc/ssh/ssh_config.d
  - /var/lib/netbird

# churn on top of debian's rules, picked by inventory group
aide_excludes_by_group:
  docker_hosts:
    - /var/lib/docker
    - /var/lib/containerd
    - /var/lib/containers       # root podman storage
    - /dev/shm                  # podman lock files, tmpfs
    - "{{ apps_root }}"
    - "/home/{{ podman_svc_prefix }}[^/]+/\\.local/share/containers"   # rootless podman images + containers, per app user
    - "/home/{{ podman_svc_prefix }}[^/]+/\\.ansible"   # module payloads when ansible runs as the svc user
    - "{{ cifs_mount_root }}"   # pool shares
    - "{{ pbs_staging_dir }}"
    - /var/lib/cloud            # cloud-init state, rewritten every boot
    - /var/tmp/cloud-init
    - /dev/disk/by-uuid         # cloud-init iso gets a dated uuid
  proxmox:
    - /etc/pve              # pmxcfs, rewritten constantly
    - /var/lib/pve-cluster
    - /var/lib/rrdcached
    - /var/lib/vz
    - /var/lib/lxcfs                # fuse view of /proc + /sys for the lxcs
    - /var/lib/lxc                  # rebuilt from /etc/pve at ct start
    - /var/cache/lxc
    - /var/lib/corosync             # ringid, config is /etc/corosync
    - /var/lib/proxmox-backup       # pbs state + graphs, config is /etc/proxmox-backup
    - /var/lib/pve-firewall         # compiled rules, source is /etc/pve/firewall
    - /var/lib/pve-manager           # replication state + lock, appliance index
    - /var/lib/smartmontools
    - /etc/issue                    # pvebanner rewrites it at boot
    - /etc/apt/apt.conf.d/76pveproxy   # generated from datacenter.cfg, comes and goes
    - /dev                          # vm disks, isos, usb, corosync shm
    - "{{ storage_pool_host }}"                          # pve-3: mergerfs pool
    - "{{ storage_disks | map(attribute='path') | list }}"   # pve-3: its disks
    - "{{ pbs_datastore_path }}"
  lxc_containers:
    - "{{ storage_root }}"   # pool bind mount
    - /dev/.lxc              # procfs from lxc, pids change every run
    - /var/lib/mosquitto     # iot lxc: broker state, saved every half hour
