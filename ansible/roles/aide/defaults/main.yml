---
# schedule: aide_check_time / aide_check_delay in group_vars hosts.yml (shared with nixos)
aide_check_nice: 19
aide_check_io_class: idle

# --init / --update hash the whole system: time limit + poll, in seconds
aide_run_timeout: 3600
aide_run_poll: 30
aide_report_lines: 150   # diff lines shown by aide-accept.yml

# accepted db hashes, one <host>.sha256 each, committed next to the code
aide_checksum_dir: "{{ playbook_dir }}/../aide"

# churn on every host. /var/log: every line is on the log lxc already, that copy is the tamper protection
aide_excludes_common:
  - /run                                # tmpfs, rebuilt on boot and daemon-reload
  - /tmp/ansible_[^/]+                  # ansible module payloads
  - /root/.ansible
  - /root/.ansible_async
  - "/home/{{ admin_user }}/.ansible"
  - /var/log
  - /var/lib/rsyslog                    # read position, queue
  - /var/cache/apt
  - /var/lib/apt/lists
  - /var/lib/PackageKit
  - /var/lib/prometheus/node-exporter   # textfile collectors

# churn on top of debian's rules, picked by inventory group
aide_excludes_by_group:
  docker_hosts:
    - /var/lib/docker
    - /var/lib/containerd
    - "{{ apps_root }}"
    - /opt/stacks               # live docker apps until the podman migration
    - "{{ cifs_mount_root }}"   # pool shares
    - "{{ pbs_staging_dir }}"
  proxmox:
    - /etc/pve              # pmxcfs, rewritten constantly
    - /var/lib/pve-cluster
    - /var/lib/rrdcached
    - /var/lib/vz
    - "{{ storage_pool_host }}"                          # pve-3: mergerfs pool
    - "{{ storage_disks | map(attribute='path') | list }}"   # pve-3: its disks
    - "{{ pbs_datastore_path }}"
  lxc_containers:
    - "{{ storage_root }}"   # pool bind mount
