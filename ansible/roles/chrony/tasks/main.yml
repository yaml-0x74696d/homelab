---
- name: Install chrony
  ansible.builtin.apt:
    name: chrony
    state: present
    update_cache: true

- name: Chrony config
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    mode: "0644"
    validate: /usr/sbin/chronyd -p -f %s
  notify: Restart chrony

# --check doesn't install the package, so the unit doesn't exist yet
- name: Enable chrony
  ansible.builtin.systemd:
    name: chrony
    state: started
    enabled: true
  ignore_errors: "{{ ansible_check_mode }}"
