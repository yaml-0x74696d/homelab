---
# allow rules tagged with lxc_base_ufw_rules_comment: adds lxc_base_ufw_rules, drops the tagged ones not in it anymore.
# lxc_base_ufw_rules: [{port, proto: tcp, src: <ip, cidr or any>, iface: <only in on it, optional>}]. deploy-iot.yml uses it too (tasks_from)
- name: Read the ufw rules
  ansible.builtin.command: ufw status
  register: lxc_base_ufw_rules_status
  changed_when: false
  check_mode: false
  ignore_errors: "{{ ansible_check_mode }}"   # no ufw yet on a fresh ct

- name: Find stale ufw rules ({{ lxc_base_ufw_rules_comment }})
  ansible.builtin.set_fact:
    lxc_base_ufw_rules_stale: "{{ lookup('ansible.builtin.template', 'ufw-stale.j2') | from_yaml or [] }}"

- name: Drop stale ufw rules ({{ lxc_base_ufw_rules_comment }})
  community.general.ufw:
    rule: allow
    port: "{{ item.port | string }}"
    proto: "{{ item.proto }}"
    from_ip: "{{ item.src }}"
    direction: "{{ 'in' if item.iface is defined else omit }}"
    interface: "{{ item.iface | default(omit) }}"
    delete: true
  loop: "{{ lxc_base_ufw_rules_stale }}"

- name: Allow in ufw ({{ lxc_base_ufw_rules_comment }})
  community.general.ufw:
    rule: allow
    port: "{{ item.port | string }}"
    proto: "{{ item.proto }}"
    from_ip: "{{ item.src }}"
    direction: "{{ 'in' if item.iface is defined else omit }}"
    interface: "{{ item.iface | default(omit) }}"
    comment: "{{ lxc_base_ufw_rules_comment }}"
  loop: "{{ lxc_base_ufw_rules }}"
  ignore_errors: "{{ ansible_check_mode }}"
