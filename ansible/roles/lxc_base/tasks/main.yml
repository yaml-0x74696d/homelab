---
- name: Install base packages
  ansible.builtin.apt:
    name: "{{ lxc_base_packages }}"
    state: present
    update_cache: true

- name: Unattended-upgrades like the vms
  ansible.builtin.include_role:
    name: vm_base
    tasks_from: unattended_upgrades

# ansible logs in as root with a key here, so root stays allowed, passwords don't
- name: Harden sshd
  ansible.builtin.template:
    src: sshd.conf.j2
    dest: /etc/ssh/sshd_config.d/10-homelab.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd

- name: Fail2ban sshd jail
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.d/10-homelab.local
    mode: "0644"
  notify: Restart fail2ban

- name: Node-exporter on the lan address
  ansible.builtin.lineinfile:
    path: /etc/default/prometheus-node-exporter
    regexp: '^ARGS='
    line: 'ARGS="--web.listen-address={{ lxc_base_node_exporter_listen }}"'
  notify: Restart node-exporter
  ignore_errors: "{{ ansible_check_mode }}"   # --check doesn't install the package

- name: Set timezone
  community.general.timezone: { name: "{{ timezone }}" }
  ignore_errors: "{{ ansible_check_mode }}"

- name: Enable and start services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: "{{ lxc_base_services }}"
  ignore_errors: "{{ ansible_check_mode }}"

- name: Ufw for node-exporter
  when: lxc_base_ufw
  block:
    - name: Install ufw
      ansible.builtin.apt:
        name: ufw
        state: present

    - name: Node-exporter from prometheus
      ansible.builtin.include_tasks: ufw_rules.yml
      vars:
        lxc_base_ufw_rules_comment: node-exporter
        lxc_base_ufw_rules: [{port: "{{ node_exporter_port }}", proto: tcp, src: "{{ prometheus_ip }}"}]
