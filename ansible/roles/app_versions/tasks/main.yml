---
- name: List the app images and their newest tags
  ansible.builtin.script:
    cmd: app-versions {{ inventory_hostname }} {{ podman_svc_prefix }} {{ podman_svc_group }} {{ app_versions_lookup_timeout }}
  register: app_versions_list
  changed_when: false
  check_mode: false

# hosts that failed above drop out of ansible_play_hosts, the page names them
- name: Write the versions page
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ app_versions_web_dir }}/index.html"
    owner: root
    group: root
    mode: '0644'
  delegate_to: "{{ app_versions_web_host }}"
  run_once: true
