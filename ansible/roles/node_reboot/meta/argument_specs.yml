---
argument_specs:
  main:
    short_description: Reboot one host if it needs one, then wait for quorum, guests and services
    options:
      node_reboot_pve:
        type: bool
        description: A pve node, true in the pve play (quorum and guest checks)
      node_reboot_check_kernel:
        type: bool
        description: needrestart's kernel and microcode check. false on the lxcs, they run the node's kernel
      node_reboot_timeout:
        type: int
        description: Seconds for the host to come back, 1800 in the pve play (the node stops its guests first)
      node_reboot_boot_time_command:
        type: str
        description: >-
          The reboot module's boot_time_command, empty = its default (boot_id). The lxc play sets init's start time,
          the boot_id there is the node's and doesn't change
      node_reboot_wait_retries:
        type: int
        description: Tries while waiting for a guest, systemd or an app
      node_reboot_wait_delay:
        type: int
        description: Seconds between them
      node_reboot_quorum_retries:
        type: int
        description: Quorum tries after the reboot (roles/update, tasks/quorum.yml gets it as update_quorum_retries)
      node_reboot_quorum_delay:
        type: int
        description: Seconds between quorum tries (update_quorum_delay in the call)
      node_reboot_ntfy_title:
        type: str
        description: ntfy title
      node_reboot_ntfy_headers:
        type: dict
        description: Headers for every ntfy push
  summary:
    short_description: Print and push the result of every host, once on the controller (reboot.yml, rescue)
    options:
      node_reboot_summary_hosts:
        type: list
        elements: str
        description: Hosts the summary covers, in play order
      node_reboot_ntfy_headers:
        type: dict
        description: Headers for the push
