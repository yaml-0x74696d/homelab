---
argument_specs:
  main:
    short_description: Proxmox Backup client, db dumps first, then the apps folders
    options:
      pbs_on_calendar:
        type: str
        description: systemd OnCalendar of the backup timer, `*-*-* 20:00:00` (schedules.yml)
      pbs_randomized_delay:
        type: str
        description: Random delay, `20m`, so the three hosts don't start at once
      pbs_datastore:
        type: str
        description: Datastore on the PBS
      pbs_token_id:
        type: str
        description: API token, backup-only
      pbs_repository:
        type: str
        description: Repository string, token@pve-3:port:datastore, built from the values above
      pbs_id:
        type: str
        description: Backup group id, one per host (the hostname)
      pbs_ntfy_url:
        type: str
        description: ntfy topic for failures, empty = off
      pbs_ntfy_token:
        type: str
        no_log: true
        description: ntfy token
      pbs_heartbeat_url:
        type: str
        description: Gatus' backend url, its port on pod-2, the heartbeat is pushed there
      pbs_heartbeat_path:
        type: str
        description: Push path with {key} for the endpoint key
      pbs_heartbeat_key:
        type: str
        description: Key of the host's external endpoint in gatus (group_name)
      pbs_heartbeat_token:
        type: str
        no_log: true
        description: Gatus push token (vault), empty = no heartbeat
      pbs_heartbeat_timeout:
        type: int
        description: Seconds the heartbeat push may take
      pbs_timeout:
        type: str
        description: A wedged push is killed after this
      pbs_jobs:
        type: list
        elements: dict
        description: >-
          Databases to dump before the push, set in host_vars: `{name, type: postgres|sqlite, container?,
          path?, data_dir?, app?}`. sqlite `path` is under `podman_apps_root`, postgres needs `app` and runs
          `podman exec` as `svc-<app>`
        options:
          name:
            type: str
            required: true
            description: Dump name
          type:
            type: str
            required: true
            choices: [postgres, sqlite]
            description: Database type
          container:
            type: str
            description: Postgres container
          path:
            type: str
            description: sqlite file, relative to the apps folder
          data_dir:
            type: str
            description: Postgres data dir, left out of the flat archive
          app:
            type: str
            description: "Postgres: the apps.yml app, the dump runs as svc-<app>"
      pbs_exclude:
        type: list
        elements: str
        description: Extra excludes for `podman-apps.pxar`, set in host_vars
