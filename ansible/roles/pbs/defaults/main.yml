---
# schedule: pbs_backup_time / pbs_backup_delay in group_vars schedules.yml
pbs_on_calendar: "{{ pbs_backup_time }}"
pbs_randomized_delay: "{{ pbs_backup_delay }}"

# pbs target. the token adds backups and restores its own, no prune or delete (role DatastoreBackup on /datastore/homelab)
pbs_datastore: homelab
pbs_token_id: "backup@pbs!client"
pbs_repository: "{{ pbs_token_id }}@{{ pve3_ip }}:{{ pbs_port }}:{{ pbs_datastore }}"
pbs_id: "{{ inventory_hostname }}"        # backup group id, one per host

# staging dir + app dir: pbs_staging_dir / podman_apps_root in group_vars (aide excludes them too)

# failure alerts → ntfy. uses the shared ntfy_url/ntfy_token from vault; empty = off.
pbs_ntfy_url: "{{ ntfy_url | default('') }}"
pbs_ntfy_token: "{{ ntfy_token | default('') }}"

# heartbeat to gatus after a good run (gatus_push_* in app_settings.yml). gatus alerts when it stops
pbs_heartbeat_url: "{{ gatus_push_url }}"
pbs_heartbeat_path: "{{ gatus_push_path }}"
pbs_heartbeat_key: "{{ gatus_push_group }}_backup-{{ inventory_hostname }}"   # <group>_<name> of the external endpoint
pbs_heartbeat_token: "{{ gatus_push_token | default('') }}"   # empty = no heartbeat
pbs_heartbeat_timeout: "{{ gatus_push_timeout }}"

# a wedged push (e.g. pve-3 half-up) must not hold the lock forever
pbs_timeout: 1h

# per-host, set in host_vars/<host>.yml
pbs_jobs: []          # dbs to dump: {name, type: postgres|sqlite, container?, path?, data_dir?, app?}
pbs_exclude: []       # extra flat-archive excludes (caches, disposable state)
