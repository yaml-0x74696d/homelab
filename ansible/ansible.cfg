[defaults]
roles_path = roles
collections_path = collections:~/.ansible/collections:/usr/share/ansible/collections
vault_password_file = ./.vault_pass
inventory = ./inventory.yml
host_key_checking = True
# results as yaml instead of one json line, and no "skipping" lines for hosts a task doesn't apply to
callback_result_format = yaml
display_skipped_hosts = false

[ssh_connection]
# first contact is trusted, a changed key fails the run. the -C/Control* part is ansible's default, ssh_args replaces it
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new

[privilege_escalation]
become = false
become_method = sudo

[colors]
# retry lines default to dark gray, invisible on a black terminal
debug = bright blue
