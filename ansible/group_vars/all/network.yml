---
# lan facts, one source each. secrets live in vault.yml, per-lab values (domain, macs) in private/.
lan_cidr: 192.168.178.0/24
gateway_ip: 192.168.178.1
docker_bridge_cidr: 172.16.0.0/12
timezone: Europe/Berlin

pve1_ip: 192.168.178.101
pve2_ip: 192.168.178.102
pve3_ip: 192.168.178.103
docker1_ip: 192.168.178.201
docker2_ip: 192.168.178.202
docker3_ip: 192.168.178.203
storage_ip: 192.168.178.150    # CT 300 on pve-3
log_ip: 192.168.178.151        # CT 301 on pve-3, central rsyslog
iot_lan_ip: 192.168.178.152    # CT 302, iot gateway (mqtt broker + exporter), lan leg
netbird_ip: 192.168.178.250    # dmz vm on pve-2
haos_ip: 192.168.178.210       # home assistant os vm on pve-3, appliance (no ansible). lease pinned by its mac
lan_bridge: vmbr0             # proxmox bridge (tofu)
iot_cidr: 192.168.50.0/24      # sensor wifi: static .2-.49, dhcp iot_dhcp_range (dnsmasq in CT 302)
iot_ip: 192.168.50.10          # CT 302 on its wifi card (wlan0), the only address in the iot net besides the sensors
iot_node: pve-1                # node with the wifi card, CT 302 runs here
iot_wifi_nic: wlp0s12f0        # the card's name on iot_node, moved into CT 302 as wlan0
iot_wifi_country: DE           # regulatory domain, set on iot_node (the ct isn't allowed to)
iot_dhcp_range: [192.168.50.50, 192.168.50.200]
dns_ip: 192.168.178.53         # service ip, follows whichever host runs dns (docker-2)
mqtt_broker_ip: "{{ iot_lan_ip }}"   # lan consumers (ha); sensors use iot_ip

# proxmox guest ids (tofu creates them with the same ids)
vmids: { docker1: 201, docker2: 202, docker3: 203, haos: 210, netbird: 250, storage: 300, log: 301, iot: 302 }
