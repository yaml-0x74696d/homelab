---
# every app, pure data (edge and ci read it with yq, so no jinja). schema + defaults:
# roles/podman_app/meta/argument_specs.yml. `runtime: compose` = still on docker:
# edge routes it, deploy-app.yml refuses it. the line goes at the app's cutover.
apps:
  gatus:
    host: docker-2
    uid: 2010
    port: 3001
    allow_from: [edge, netbird, homepage]
    secrets:
      - name: gatus-config
        template: config.yaml.j2
    dirs:
      - path: data
    containers:
      - name: gatus
        image: ghcr.io/twin/gatus
        tag: stable
        healthcheck: false   # scratch image, nothing to run a check with
        add_caps: [NET_RAW]  # runs as root in the container, so pings use raw sockets
    homepage: {group: Status, icon: gatus, widget: gatus}
    routes:
      - host: status
        middlewares: [authentik]

  grafana:
    host: docker-2
    uid: 2030
    port: 3000
    allow_from: [edge, netbird, homepage]
    secrets:
      - name: grafana-admin-pass
        vault: grafana_pass
      - name: grafana-oidc-secret
        vault: grafana_oidc_secret
    dirs:
      - path: data
        mode: "0770"   # grafana runs as 472:0 in the container, gid 0 = svc-grafana's group
    containers:
      - name: grafana
        image: docker.io/grafana/grafana-oss
        tag: latest
    homepage: {group: Admin, icon: grafana}
    routes:
      - host: grafana

  nginx:
    host: docker-2
    uid: 2020
    port: 8087
    allow_from: [edge, netbird, homepage]
    secrets: []
    containers:
      - name: nginx
        image: docker.io/library/nginx
        tag: alpine
    homepage: {group: Tools, icon: nginx, label: Web}
    routes:
      - host: web

  prometheus:
    host: docker-2
    uid: 2040
    port: 9091
    allow_from: [edge, netbird, homepage]   # netbird = docker-2's ip, so grafana and gatus are in
    secrets: []
    dirs:
      - path: data
        owner: 65534   # prom/prometheus runs as nobody, not root
    containers:
      - name: prometheus
        image: docker.io/prom/prometheus
        tag: latest
    homepage: {group: Admin, icon: prometheus}
    routes:
      - host: prom
        middlewares: [authentik]   # grafana reaches prom internally, not via this url

  # two copies on two nodes write the same wan ip, one host down doesn't stop the updates
  cloudflare-ddns:
    hosts: [docker-1, docker-2]
    uid: 2050
    allow_from: []
    secrets:
      - name: cloudflare-api-token
        vault: cf_token
    containers:
      - name: cloudflare-ddns
        image: docker.io/favonia/cloudflare-ddns
        tag: latest
        user: "1000:1000"
        healthcheck: false   # scratch image
        read_only: true
        drop_caps: [ALL]

  # runs the playbooks on a schedule, from a git clone (roles/ctl_base)
  semaphore:
    host: ctl-1
    uid: 2060
    port: 3000
    allow_from: [edge, netbird, homepage]
    secrets:
      - name: semaphore-admin-pass
        vault: semaphore_admin_pass
      - name: semaphore-key-encryption
        vault: semaphore_key_encryption
      - name: semaphore-oidc
        template: oidc.json.j2
    dirs:
      - path: data
        owner: 1001   # the image's semaphore user
      - path: aide    # accepted aide hashes, ctl-0 reads them back
        owner: 1001
        mode: "0755"
    containers:
      - name: semaphore
        image: docker.io/semaphoreui/semaphore
        tag: latest
    homepage: {group: Admin, icon: semaphore}
    routes:
      - host: semaphore

  nextcloud:
    host: docker-3
    uid: 2070
    port: 8080
    allow_from: [edge, netbird, homepage]
    secrets:
      - name: nextcloud-db-pass
        vault: nextcloud_db_pass
      - name: nextcloud-admin-pass
        vault: nextcloud_admin_pass
    container_uid: 33   # apache drops to www-data, keep-id puts it on svc-nextcloud
    start_timeout: 15min   # occ upgrade runs on start after an image bump
    dirs:
      - path: html
      - path: database
        owner: 70   # postgres in the alpine image
        mode: "0700"   # initdb sets it, 0750 would flip back each run
    cifs:
      - {share: nextcloud, user: nextcloud, path: nextcloud, opts: [nobrl]}   # smb locking
      # other apps' shares, external storage inside nextcloud
      - {share: media, user: media, path: nc-media}
      - {share: documents, user: paperless, path: nc-documents}
      - {share: photos, user: immich, path: nc-photos, opts: [ro]}   # immich owns that library
    # keep-id makes 33 every container's default user, so each one names its own
    containers:
      - name: nextcloud
        image: docker.io/library/nextcloud
        tag: 35-apache   # nextcloud can't skip a major, bump by hand one at a time
        user: "0:0"   # apache starts as root, then drops to www-data
        after: [nextcloud-db, nextcloud-redis]
        cifs: [nextcloud, nc-media, nc-documents, nc-photos]
      - name: nextcloud-db
        image: docker.io/library/postgres
        tag: 16-alpine
        user: "70:70"
        auto_update: false
      - name: nextcloud-redis
        image: docker.io/library/redis
        tag: alpine
        user: "999:1000"
        auto_update: false
    homepage: {group: Homecloud, icon: nextcloud}
    routes:
      - host: cloud
        middlewares: [nextcloud-dav]

  immich:
    host: docker-3
    uid: 2080
    port: 8081
    allow_from: [edge, netbird, homepage]
    secrets:
      - name: immich-db-pass
        vault: immich_db_pass
    dirs:
      - path: postgres   # local, the db must not live on a network share
        owner: 999   # postgres in the debian-based image
        mode: "0700"   # initdb sets it, 0750 would flip back each run
    cifs:
      - {share: photos, user: immich, path: photos}
    containers:
      - name: immich
        image: ghcr.io/immich-app/immich-server
        tag: release
        after: [immich-db, immich-redis]
        cifs: [photos]
      - name: immich-db
        image: ghcr.io/immich-app/postgres
        tag: 14-vectorchord0.4.3-pgvectors0.2.0   # vector-enabled build, never plain postgres
        auto_update: false
      - name: immich-redis
        image: docker.io/valkey/valkey
        tag: "9"
        auto_update: false
    homepage: {group: Homecloud, icon: /images/immich.png}
    routes:
      - host: photo

  jellyfin:
    host: docker-3
    uid: 2090
    port: 8082
    allow_from: [edge, netbird, homepage]
    secrets: []
    dirs:
      - path: config
      - path: cache
    cifs:
      - {share: media, user: media, path: media, opts: [ro]}
    containers:
      - name: jellyfin
        image: docker.io/jellyfin/jellyfin
        tag: latest
        cifs: [media]
    homepage: {group: Homecloud, icon: jellyfin}
    routes:
      - host: media

  paperless:
    host: docker-3
    uid: 2100
    port: 8083
    allow_from: [edge, netbird, homepage]
    secrets:
      - name: paperless-db-pass
        vault: paperless_db_pass
      - name: paperless-secret-key
        vault: paperless_secret_key
      - name: paperless-admin-pass
        vault: paperless_admin_pass
      - name: paperless-oidc
        template: socialaccount.json.j2
    container_uid: 1000   # the image drops to 1000, keep-id puts it on svc-paperless
    dirs:
      - path: data
      - path: database
        owner: 70   # postgres in the alpine image
        mode: "0700"   # initdb sets it, 0750 would flip back each run
    cifs:
      - {share: documents, user: paperless, path: documents}
    # keep-id makes 1000 every container's default user, so each one names its own
    containers:
      - name: paperless
        image: ghcr.io/paperless-ngx/paperless-ngx
        tag: latest
        user: "0:0"   # s6 starts as root, then drops to USERMAP_UID
        after: [paperless-db, paperless-redis]
        cifs: [documents]
      - name: paperless-db
        image: docker.io/library/postgres
        tag: 16-alpine
        user: "70:70"
        auto_update: false
      - name: paperless-redis
        image: docker.io/library/redis
        tag: alpine
        user: "999:1000"
        auto_update: false
      - name: paperless-gotenberg
        image: docker.io/gotenberg/gotenberg
        tag: "8"
        user: "1001:1001"
      - name: paperless-tika
        image: docker.io/apache/tika
        tag: latest
        user: "35002:35002"
        healthcheck: false   # no curl or wget in the image
    homepage: {group: Homecloud, icon: paperless-ngx}
    routes:
      - host: paperless

  # docker-1: no published port (traefik reaches them on proxy-net)
  authentik:
    host: docker-1
    runtime: compose
    port: 9000
    homepage: {group: Admin, icon: authentik}
    routes:
      - host: auth

  vaultwarden:
    host: docker-1
    runtime: compose
    port: 8084
    homepage: {group: Homecloud, icon: /images/vaultwarden.png}
    routes:
      - host: vault
      - host: vault
        path: /admin
        middlewares: [authentik]

  gitea:
    host: docker-1
    runtime: compose
    port: 3002
    extra_ports:
      - {port: 2222, allow_from: [lan, netbird]}   # git over ssh
    homepage: {group: Tools, icon: gitea}
    routes:
      - host: git

  searxng:
    host: docker-1
    runtime: compose
    port: 8085
    homepage: {group: Tools, icon: searxng, label: SearXNG}
    routes:
      - host: search

  homepage:
    host: docker-1
    runtime: compose
    port: 3003
    routes:
      - host: home

  pdfcraft:
    host: docker-1
    runtime: compose
    port: 8086
    homepage: {group: Tools, icon: /images/pdfcraft.png, label: PDFcraft}
    routes:
      - host: pdf

  # haos vm, home assistant updates and configures itself inside, ansible never deploys it
  homeassistant:
    host: haos
    runtime: vm
    port: 80   # haos core serves on 80, 8123 only redirects there
    homepage: {group: Home, icon: /images/homeassistant.png, label: Home Assistant}
    routes:
      - host: ha

# traefik routes that aren't apps
infra_routes:
  - host: pve-1
  - host: pve-2
  - host: pve-3
  - host: pbs
  - host: dns     # pi-hole ui
    homepage: {group: Admin, icon: /images/pihole.png, label: Pi-hole, path: /admin/login}
  - host: proxy   # traefik's own dashboard
    homepage: {group: Admin, icon: /images/traefik.png, label: Traefik}
