---
# every app, pure data (edge and ci read it with yq, so no jinja). schema + defaults:
# roles/podman_app/meta/argument_specs.yml. `runtime: compose` = still on docker:
# edge routes it, deploy-app.yml refuses it. the line goes at the app's cutover.
apps:
  uptime-kuma:
    host: docker-2
    runtime: compose
    uid: 2010
    port: 3001
    allow_from: [edge, netbird]
    secrets: []
    dirs:
      - path: data
    containers:
      - name: uptime-kuma
        image: docker.io/louislam/uptime-kuma
        tag: "1"
    routes:
      - host: status

  grafana:
    host: docker-2
    runtime: compose
    port: 3000
    routes:
      - host: grafana

  homelable:
    host: docker-2
    runtime: compose
    port: 8085
    routes:
      - host: homelable

  influxdb:
    host: docker-2
    runtime: compose
    port: 8086
    routes:
      - host: influx

  nginx:
    host: docker-2
    runtime: compose
    port: 8087
    routes:
      - host: web

  prometheus:
    host: docker-2
    runtime: compose
    port: 9091
    routes:
      - host: prom
        middlewares: [authentik]   # grafana reaches prom internally, not via this url

  nextcloud:
    host: docker-3
    runtime: compose
    port: 8080
    routes:
      - host: cloud
        middlewares: [nextcloud-dav]

  immich:
    host: docker-3
    runtime: compose
    port: 8081
    routes:
      - host: photo

  jellyfin:
    host: docker-3
    runtime: compose
    port: 8082
    routes:
      - host: media

  paperless:
    host: docker-3
    runtime: compose
    port: 8083
    routes:
      - host: paperless

# docker-1's apps (no published port yet) and the pve/pbs routes join in phase 2, with edge
infra_routes: []
