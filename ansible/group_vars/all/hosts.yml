---
# host hardening + housekeeping (vm-preparation, journald.yml, update-all.yml, push-keys.yml)
ssh_port: 22
ssh_max_auth_tries: 3
ssh_client_alive_interval: 300     # seconds
ssh_client_alive_count_max: 0

docker_log_max_size: 10m           # per container log file
docker_log_max_files: 3

journald_max_use: 500M
apt_cache_valid_time: 3600         # seconds before update-all refreshes the cache

# aide daily check (roles/aide + nixos aide.nix), spread so hosts sharing disks don't scan at once
aide_check_time: "*-*-* 12:00:00"
aide_check_delay: 30min

admin_ssh_pubkey_file: ~/.ssh/id_ed25519.pub   # on the controller

login_banner_text: |
  ************************************************************************
  * AUTHORIZED ACCESS ONLY. All activity is logged and monitored.        *
  * Disconnect immediately if you are not an authorized administrator.   *
  ************************************************************************
