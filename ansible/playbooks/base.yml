---
# base: cron, journal, logs on every guest, time on the vms, hardening on the lxcs. pve nodes not included.
# order: tofu apply (log lxc) → deploy-pve-firewall.yml → this.

- name: Base tools on the guests
  hosts: docker_hosts:lxc_containers
  roles:
    - cronie
    - journald
    - rsyslog

- name: Time sync on the vms
  hosts: docker_hosts
  roles:
    - chrony

# the vms get theirs from vm-preparation.yml (roles/vm_base)
- name: Hardening on the lxcs
  hosts: lxc_containers
  roles:
    - lxc_base
