---
# the nixos vms' /var/lib/secrets from the vault, as a tree for nixos-anywhere --extra-files (docs/bootstrap.md step 4):
#   ansible-playbook playbooks/nixos-secrets.yml -e secrets_dir=$XDG_RUNTIME_DIR/nixos-secrets
# one tree per host in <secrets_dir>/<host>, paths as nixos/ reads them
- name: Nixos secrets tree
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    secrets_dir: ""   # required, keep it in ram
    nixos_secrets_cf_env: "CF_DNS_API_TOKEN={{ cf_token }}\n"
    nixos_secrets_ntfy_env: "NTFY_URL={{ ntfy_url }}\nNTFY_TOKEN={{ ntfy_token }}\n"
    # path under /var/lib/secrets. single values without a newline
    nixos_secrets:
      - { host: netbird, path: netbird/datastore-key, content: "{{ vault_nixos_netbird_datastore_key }}" }
      - { host: netbird, path: netbird/idp-svc-password, content: "{{ vault_nixos_netbird_idp_password }}" }
      - { host: netbird, path: netbird/turn-secret, content: "{{ vault_nixos_netbird_turn_secret }}" }
      - { host: netbird, path: netbird/turn-password, content: "{{ vault_nixos_netbird_turn_password }}" }
      - { host: netbird, path: netbird/cloudflare.env, content: "{{ nixos_secrets_cf_env }}" }
      - { host: netbird, path: aide/ntfy.env, content: "{{ nixos_secrets_ntfy_env }}" }
      - { host: edge, path: edge/cloudflare.env, content: "{{ nixos_secrets_cf_env }}" }
      - { host: edge, path: aide/ntfy.env, content: "{{ nixos_secrets_ntfy_env }}" }
    nixos_secrets_hosts: "{{ nixos_secrets | map(attribute='host') | unique }}"
    nixos_secrets_dirs: "{{ nixos_secrets | map(attribute='host') | zip(nixos_secrets | map(attribute='path') | map('dirname')) | unique }}"

  tasks:
    - name: Check secrets_dir
      ansible.builtin.assert:
        that: secrets_dir is abs
        fail_msg: "-e secrets_dir=<absolute path> missing, e.g. $XDG_RUNTIME_DIR/nixos-secrets"
        quiet: true

    - name: Top dir
      ansible.builtin.file:
        path: "{{ secrets_dir }}"
        state: directory
        mode: "0700"

    # copied onto the target's /, so 0755 up to var/lib
    - name: Host dirs
      ansible.builtin.file:
        path: "{{ secrets_dir }}/{{ item.0 }}{{ item.1 }}"
        state: directory
        mode: "0755"
      loop: "{{ nixos_secrets_hosts | product(['', '/var', '/var/lib']) | list }}"

    - name: Secret dirs
      ansible.builtin.file:
        path: "{{ secrets_dir }}/{{ item.0 }}/var/lib/secrets/{{ item.1 }}"
        state: directory
        mode: "0700"
      loop: "{{ nixos_secrets_hosts | product(['']) | list + nixos_secrets_dirs }}"

    - name: Secret files
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ secrets_dir }}/{{ item.host }}/var/lib/secrets/{{ item.path }}"
        mode: "0600"
      loop: "{{ nixos_secrets }}"
      no_log: true
