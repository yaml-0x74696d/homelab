---
- name: Provision the vms (hardening in roles/vm_base)
  hosts: pod_vms
  become: true

  roles:
    - vm_base
    - podman_base

  tasks:
    - name: Install ufw
      ansible.builtin.apt:
        name: ufw
        state: present

    - name: Set default ufw policies
      community.general.ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: 'incoming', policy: 'deny' }
        - { direction: 'outgoing', policy: 'allow' }

    - name: Allow ufw ports & rate limiting
      community.general.ufw:
        rule: "{{ item.rule | default('allow') }}"
        port: "{{ item.port | default(omit) }}"
        proto: "{{ item.proto | default('any') }}"
        src: "{{ item.src | default(lan_cidr) }}"
        direction: in
      loop:
        - { rule: 'limit', port: "{{ ssh_port }}" }
        - { port: "{{ cockpit_port }}" }
        - { port: "{{ node_exporter_port }}", proto: 'tcp' }

    - name: Enable ufw
      community.general.ufw:
        state: enabled

    # last, so the baseline already contains the hardening above
    - name: AIDE file integrity
      ansible.builtin.include_role:
        name: aide
      tags: [aide]
