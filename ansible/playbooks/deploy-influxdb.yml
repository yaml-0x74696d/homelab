---
- name: Deploy influxdb
  hosts: docker-2
  become: true
  vars:
    influxdb_tag: "2"                    # major pin
    influxdb_uid: 1000                   # image user
  roles:
    - role: docker_app
      vars:
        docker_app_name: influxdb
        docker_app_dirs:
          - { path: data, owner: "{{ influxdb_uid }}", group: "{{ influxdb_uid }}" }
          - { path: config, owner: "{{ influxdb_uid }}", group: "{{ influxdb_uid }}" }
        docker_app_ufw:
          - { port: "{{ app_ports.influxdb }}" }   # HA on docker-1 writes cross-host
