---
# aide on every ansible host: install, excludes, baseline (first run only), daily check.
# re-running it also verifies each db against aide/<host>.sha256. nixos vms: nixos/aide-accept.sh <host>
# hosts in reach_optional_hosts may be off
- name: Reach
  hosts: pod_vms:podman_hosts:proxmox:lxc_containers
  gather_facts: false
  roles: [reach]

- name: AIDE file integrity
  hosts: pod_vms:podman_hosts:proxmox:lxc_containers:&reachable
  roles:
    - aide

# no :&reachable here, so a host that failed above is still counted and no heartbeat goes out
- name: Heartbeat
  hosts: pod_vms:podman_hosts:proxmox:lxc_containers
  gather_facts: false
  tasks:
    - name: Push to gatus
      ansible.builtin.include_role:
        name: gatus_push
      vars:
        gatus_push_job: aide
