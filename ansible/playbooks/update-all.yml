---
# updates every host, pve nodes included. pve REQUIRES dist-upgrade — plain `apt upgrade`
# holds back kernel/qemu/zfs and half-upgrades the node. never reboots: a new kernel needs a
# planned reboot with that node's guests shut down first (this play only flags it).
- name: Update and upgrade all APT systems
  hosts: all
  serial: 1                    # one host at a time — never two pve nodes at once; docker bounces singly
  # become/user come from inventory per group (docker=sudo, pve/lxc=root)

  tasks:
    - name: Update apt cache on {{ inventory_hostname }}
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: "{{ apt_cache_valid_time }}"

    - name: Dist-upgrade {{ inventory_hostname }}
      ansible.builtin.apt:
        upgrade: dist          # = apt full-upgrade; the pve-safe mode (installs new kernel/qemu, doesn't hold back)
        dpkg_options: force-confdef,force-confold

    - name: Autoremove on {{ inventory_hostname }}
      ansible.builtin.apt:
        autoremove: true

    - name: Check pending reboot (running kernel vs newest installed) on {{ inventory_hostname }}
      ansible.builtin.shell: |
        set -o pipefail
        running=$(uname -r)
        newest=$(ls -1 /boot/vmlinuz-* 2>/dev/null | sed 's|.*/vmlinuz-||' | sort -V | tail -n1)
        [ "$running" = "$newest" ] && echo ok || echo reboot
      args:
        executable: /bin/bash
      register: _kern
      changed_when: false
      check_mode: false

    - name: Flag reboot needed on {{ inventory_hostname }}
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: new kernel installed — plan a reboot (shut this node's guests down first)."
      when: _kern.stdout == 'reboot'
