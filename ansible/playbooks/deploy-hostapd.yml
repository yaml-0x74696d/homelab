---
- name: Deploy hostapd access point
  hosts: iot_ap   # inventory.yml
  become: true
  vars:
    hostapd_interface: wlp0s12f0           # onboard wifi card, check the name on another node
    hostapd_bridge: "{{ iot_bridge }}"
    hostapd_channel: 6
    hostapd_country: DE
  tags: ['hostapd', 'wifi']

  tasks:
    - name: Ensure hostapd is installed
      ansible.builtin.apt:
        name: hostapd
        state: present
        update_cache: true

    - name: Deploy hostapd.conf
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../apps/hostapd/hostapd.conf.j2"
        dest: /etc/hostapd/hostapd.conf
        mode: '0600'
        owner: root
        group: root
      notify: Restart hostapd

    - name: Ensure hostapd service is enabled and started
      ansible.builtin.systemd:
        name: hostapd
        state: started
        enabled: true
        masked: false

  handlers:
    - name: Restart hostapd
      ansible.builtin.systemd:
        name: hostapd
        state: restarted
