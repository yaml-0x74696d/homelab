---
# swap debian's default motd for fastfetch, fleet-wide.
# become/user come from inventory per group (docker=sudo, pve/storage=root).
- name: Fastfetch login banner
  hosts: all:!appliances
  tasks:
    - name: Install fastfetch
      ansible.builtin.apt:
        name: fastfetch
        state: present
        update_cache: true

    - name: Clear static motd
      ansible.builtin.copy:
        content: ""
        dest: /etc/motd
        owner: root
        group: root
        mode: "0644"

    - name: Find dynamic motd scripts
      ansible.builtin.find:
        paths: /etc/update-motd.d
        file_type: file
      register: motd_scripts

    # statoverride, so a package update doesn't make them executable again. --list prints 644, no leading 0
    - name: Disable dynamic motd scripts
      ansible.builtin.shell: >-
        case "$(dpkg-statoverride --list {{ item.path | quote }})" in *' 644 '*) ;;
        *) dpkg-statoverride --force-statoverride-add --update --add root root 0644 {{ item.path | quote }} && echo changed ;; esac
      register: motd_override
      changed_when: "'changed' in motd_override.stdout"
      loop: "{{ motd_scripts.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Fastfetch on interactive login
      ansible.builtin.copy:
        dest: /etc/profile.d/fastfetch.sh
        owner: root
        group: root
        mode: "0644"
        content: |
          # interactive logins only — don't break scp/rsync/sftp
          case $- in *i*) ;; *) return ;; esac
          command -v fastfetch >/dev/null && fastfetch
