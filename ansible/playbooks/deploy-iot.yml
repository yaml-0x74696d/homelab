---
# iot gateway lxc (CT 302): the iot wifi (card moved into the ct), mqtt broker + exporter for the sensors and the lan
# consumers, firmware downloads. first: deploy-pve-firewall.yml, tofu apply (the ct), base.yml -l iot.
# after: aide.yml -l iot (docs/iot.md)

# the api can't set raw lxc keys, so the card goes in here. a changed line restarts the ct
- name: Wifi card into the iot gateway
  hosts: proxmox   # hosts: can't read group_vars, iot_node picks the node below
  gather_facts: false
  vars:
    iot_ct_conf: "/etc/pve/lxc/{{ vmids.iot }}.conf"
    # lxc.net.9: clear of proxmox's own net0.. lines. phys moves the whole phy, back to the node when the ct stops
    iot_ct_wifi_lines:
      - "lxc.net.9.type: phys"
      - "lxc.net.9.link: {{ iot_wifi_nic }}"
      - "lxc.net.9.name: wlan0"
      - "lxc.net.9.ipv4.address: {{ iot_ip }}/{{ iot_cidr | split('/') | last }}"
      - "lxc.net.9.flags: up"
      - "lxc.hook.stop: /usr/local/sbin/iot-wifi-back"
      - "lxc.hook.pre-start: /usr/local/sbin/iot-wifi-back"

  tasks:
    - name: Only iot_node
      ansible.builtin.meta: end_host
      when: inventory_hostname != iot_node

    # stays on the node: the ct may not set it, hostapd there runs without country_code
    - name: Regulatory domain at boot
      ansible.builtin.copy:
        dest: /etc/modprobe.d/cfg80211-regdom.conf
        content: "options cfg80211 ieee80211_regdom={{ iot_wifi_country }}\n"
        mode: "0644"

    - name: Read the regulatory domain
      ansible.builtin.command: iw reg get
      register: iot_node_reg
      changed_when: false
      check_mode: false

    - name: Regulatory domain now
      ansible.builtin.command: "iw reg set {{ iot_wifi_country }}"
      when: ("country " ~ iot_wifi_country ~ ":") not in iot_node_reg.stdout
      changed_when: true

    # left alone, a stopped ct hands the card back late (with its netns) and as wlan0, and the next start fails.
    # stop: takes the card out of the ct's netns under its node name. pre-start: waits/renames in case stop didn't run.
    - name: Card back to the node when the ct stops
      ansible.builtin.copy:
        dest: /usr/local/sbin/iot-wifi-back
        mode: "0755"
        content: |
          #!/bin/sh
          # managed by ansible (deploy-iot.yml), lxc.hook.stop + lxc.hook.pre-start of CT {{ vmids.iot }}
          nic={{ iot_wifi_nic }}
          # hook.version 0 passes type and namespaces as args, version 1 as LXC_HOOK_TYPE / LXC_NET_NS
          netns="${LXC_NET_NS:-}"
          case "${LXC_HOOK_TYPE:-$3}" in
          stop)
              for a in "$@"; do case "$a" in net:*) netns="${a#net:}" ;; esac; done
              [ -n "$netns" ] || exit 0
              phy=$(nsenter --net="$netns" iw dev wlan0 info 2>/dev/null | awk '/wiphy/ {print "phy" $2}')
              [ -n "$phy" ] || exit 0
              nsenter --net="$netns" ip link set wlan0 down
              nsenter --net="$netns" ip link property del dev wlan0 altname "$nic" 2>/dev/null
              nsenter --net="$netns" ip link set wlan0 name "$nic"
              nsenter --net="$netns" iw phy "$phy" set netns 1
              ;;
          pre-start)
              for i in $(seq 1 30); do
                  [ -e "/sys/class/net/$nic/phy80211" ] && exit 0
                  if [ -e /sys/class/net/wlan0/phy80211 ]; then
                      ip link set wlan0 down
                      ip link property del dev wlan0 altname "$nic" 2>/dev/null   # udev hands the old name back as an altname
                      ip link set wlan0 name "$nic" && exit 0
                  fi
                  sleep 1
              done
              echo "$nic not back on the node after 30s" >&2
              exit 1
              ;;
          esac

    # before any [snapshot] section, end of file when there's none
    - name: Card into the ct
      ansible.builtin.lineinfile:
        path: "{{ iot_ct_conf }}"
        regexp: "^{{ item.split(':')[0] | regex_escape }}:"
        line: "{{ item }}"
        insertbefore: '^\['
      loop: "{{ iot_ct_wifi_lines }}"
      notify: Restart the iot ct

  handlers:
    - name: Restart the iot ct
      ansible.builtin.shell: |
        set -e
        if [ "$(pct status {{ vmids.iot }})" = "status: running" ]; then pct shutdown {{ vmids.iot }} --timeout 60; fi
        pct start {{ vmids.iot }}
      changed_when: true
      listen: Restart the iot ct

    - name: Wait for the iot ct
      ansible.builtin.wait_for:
        host: "{{ iot_lan_ip }}"
        port: "{{ ssh_port }}"
        timeout: 120
      delegate_to: localhost
      become: false
      listen: Restart the iot ct

- name: Iot gateway
  hosts: iot
  vars:
    # inbound. the lan part is the same as iot.fw (roles/pve_firewall), the wifi part only on wlan0 (nothing else
    # filters it). dhcp clients have no address yet, so 67 is from any. callers: app_settings.yml, network.yml
    iot_ufw_rules: >-
      {{ iot_net_ports | map('community.general.dict_kv', 'port') | map('combine', {'proto': 'tcp', 'src': iot_cidr, 'iface': 'wlan0'}) | list
         + [{'port': 67, 'proto': 'udp', 'src': 'any', 'iface': 'wlan0'}]
         + mqtt_lan_clients | map(attribute='ip') | map('community.general.dict_kv', 'src')
           | map('combine', {'port': mqtt_port, 'proto': 'tcp'}) | list
         + [{'port': mqtt_exporter_port, 'proto': 'tcp', 'src': prometheus_ip}] }}

  tasks:
    - name: Install ufw
      ansible.builtin.apt:
        name: ufw
        state: present
        update_cache: true

    - name: Ufw default policies
      community.general.ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: incoming, policy: deny }
        - { direction: outgoing, policy: allow }   # egress is limited in iot.fw
      ignore_errors: "{{ ansible_check_mode }}"    # --check doesn't install ufw

    - name: Ufw limit ssh from the lan
      community.general.ufw:
        rule: limit
        port: "{{ ssh_port }}"
        proto: tcp
        src: "{{ lan_cidr }}"
      ignore_errors: "{{ ansible_check_mode }}"

    # node-exporter's rule comes from roles/lxc_base
    - name: Ufw wifi, mqtt, firmware, exporter
      ansible.builtin.include_role:
        name: lxc_base
        tasks_from: ufw_rules
      vars:
        lxc_base_ufw_rules_comment: iot gateway
        lxc_base_ufw_rules: "{{ iot_ufw_rules }}"

    - name: Enable ufw
      community.general.ufw:
        state: enabled
      ignore_errors: "{{ ansible_check_mode }}"

    - name: Wifi and dhcp
      ansible.builtin.include_role:
        name: iot_ap

    - name: Broker
      ansible.builtin.include_role:
        name: mosquitto

    - name: Exporter
      ansible.builtin.include_role:
        name: mqtt_exporter

    - name: Firmware downloads
      ansible.builtin.include_role:
        name: ota_server
