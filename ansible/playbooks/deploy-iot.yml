---
# iot gateway lxc (CT 302): the iot wifi (card moved into the ct), mqtt broker + exporter for the sensors and the lan
# consumers, firmware downloads. first: deploy-pve-firewall.yml, tofu apply (the ct), base.yml -l iot.
# after: aide.yml -l iot (docs/iot.md)

- name: Wifi card into the iot gateway
  hosts: proxmox   # hosts: can't read group_vars, iot_node picks the node below
  gather_facts: false
  tasks:
    - name: Only iot_node
      ansible.builtin.meta: end_host
      when: inventory_hostname != iot_node

    - name: Card, hook, regulatory domain
      ansible.builtin.include_role:
        name: iot_node

- name: Iot gateway
  hosts: iot
  vars:
    # inbound. the lan part is the same as iot.fw (roles/pve_firewall), the wifi part only on wlan0 (nothing else
    # filters it). dhcp clients have no address yet, so 67 is from any. callers: app_settings.yml, network.yml
    iot_ufw_rules: >-
      {{ iot_net_ports | map('community.general.dict_kv', 'port') | map('combine', {'proto': 'tcp', 'src': iot_cidr, 'iface': 'wlan0'}) | list
         + [{'port': 67, 'proto': 'udp', 'src': 'any', 'iface': 'wlan0'}]
         + mqtt_lan_clients | map(attribute='ip') | map('community.general.dict_kv', 'src')
           | map('combine', {'port': mqtt_port, 'proto': 'tcp'}) | list
         + [{'port': mqtt_exporter_port, 'proto': 'tcp', 'src': prometheus_ip}] }}

  tasks:
    - name: Install ufw
      ansible.builtin.apt:
        name: ufw
        state: present
        update_cache: true

    - name: Ufw default policies
      community.general.ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: incoming, policy: deny }
        - { direction: outgoing, policy: allow }   # egress is limited in iot.fw
      ignore_errors: "{{ ansible_check_mode }}"    # --check doesn't install ufw

    - name: Ufw limit ssh from the lan
      community.general.ufw:
        rule: limit
        port: "{{ ssh_port }}"
        proto: tcp
        src: "{{ lan_cidr }}"
      ignore_errors: "{{ ansible_check_mode }}"

    # node-exporter's rule comes from roles/lxc_base
    - name: Ufw wifi, mqtt, firmware, exporter
      ansible.builtin.include_role:
        name: lxc_base
        tasks_from: ufw_rules
      vars:
        lxc_base_ufw_rules_comment: iot gateway
        lxc_base_ufw_rules: "{{ iot_ufw_rules }}"

    - name: Enable ufw
      community.general.ufw:
        state: enabled
      ignore_errors: "{{ ansible_check_mode }}"

    - name: Wifi and dhcp
      ansible.builtin.include_role:
        name: iot_ap

    - name: Broker
      ansible.builtin.include_role:
        name: mosquitto

    - name: Exporter
      ansible.builtin.include_role:
        name: mqtt_exporter

    - name: Firmware downloads
      ansible.builtin.include_role:
        name: ota_server
