---
- name: Deploy mqtt-exporter
  hosts: docker-1
  become: true
  vars:
    mqtt_exporter_log_level: DEBUG
  roles:
    - role: docker_app
      vars:
        docker_app_name: mqtt-exporter
        docker_app_compose_pull: always
        docker_app_ufw:
          - { port: "{{ app_ports.mqtt_exporter }}" }
