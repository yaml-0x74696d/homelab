---
# authentik = podman_app + guards: it can't skip a release series or go back, migrations take a while
- name: Deploy authentik
  hosts: pod-1
  become: true
  vars:
    authentik_tag: "{{ (apps.authentik.containers | selectattr('name', 'eq', 'authentik') | first).tag }}"
    authentik_user: "{{ podman_svc_prefix }}authentik"
    authentik_user_env:
      XDG_RUNTIME_DIR: "/run/user/{{ apps.authentik.uid }}"
    authentik_pool_node: pve-1           # thin pool pod-1's disk lives on
    authentik_pool_lv: pve/data
    authentik_pool_max_pct: 85           # refuse to pull above this
    authentik_ready_retries: 30
    authentik_ready_delay: 10

  pre_tasks:
    - name: Check host and tags in apps.yml
      ansible.builtin.assert:
        that:
          - apps.authentik.host == inventory_hostname
          - apps.authentik.containers | selectattr('name', 'match', 'authentik(-worker)?$') | map(attribute='tag') | unique | length == 1
        fail_msg: "apps.yml: authentik has to live on {{ inventory_hostname }}, server and worker on the same tag"
        quiet: true

    - name: Look up {{ authentik_user }}
      ansible.builtin.getent:
        database: passwd
        key: "{{ authentik_user }}"
        fail_key: false

    - name: Read running authentik
      ansible.builtin.command: podman container inspect authentik
      become: true
      become_user: "{{ authentik_user }}"
      environment: "{{ authentik_user_env }}"
      register: authentik_running
      changed_when: false
      failed_when: false
      no_log: true   # inspect carries the container env
      when: ansible_facts.getent_passwd[authentik_user] is not none

    - name: Refuse downgrades and skipped releases
      vars:
        _cur: "{{ (authentik_running.stdout | from_json | first).ImageName.split(':')[-1] }}"
        _cur_series: "{{ _cur.split('.')[:2] | join('.') }}"
        _new_series: "{{ authentik_tag.split('.')[:2] | join('.') }}"
      ansible.builtin.assert:
        that:
          - authentik_tag is version(_cur, '>=')
          - authentik_series.index(_new_series) - authentik_series.index(_cur_series) <= 1
        fail_msg: "running {{ _cur }}, asked for {{ authentik_tag }}: go one series at a time, {{ authentik_series | join(' → ') }}"
        quiet: true
      when: authentik_running.rc | default(1) == 0

    # a full thin pool freezes pod-1
    - name: Read thin pool usage on {{ authentik_pool_node }}
      ansible.builtin.command: lvs --noheadings -o data_percent {{ authentik_pool_lv }}
      delegate_to: "{{ authentik_pool_node }}"
      become: false
      register: authentik_pool
      changed_when: false

    - name: Refuse to pull with the pool nearly full
      ansible.builtin.assert:
        that: authentik_pool.stdout | trim | float < authentik_pool_max_pct
        fail_msg: "{{ authentik_pool_node }} thin pool at {{ authentik_pool.stdout | trim }}%, prune + fstrim pod-1 first"
        quiet: true

  roles:
    - role: podman_app
      vars:
        podman_app_name: authentik
        podman_app_entry: "{{ apps.authentik }}"

  post_tasks:
    # the role's start waits for healthy (Notify=healthy), migrations included
    - name: Read authentik after the deploy
      ansible.builtin.command: podman container inspect authentik
      become: true
      become_user: "{{ authentik_user }}"
      environment: "{{ authentik_user_env }}"
      register: authentik_up
      changed_when: false
      no_log: true

    - name: Check it's the requested version
      ansible.builtin.assert:
        that: (authentik_up.stdout | from_json | first).ImageName.endswith(':' ~ authentik_tag)
        fail_msg: "running {{ (authentik_up.stdout | from_json | first).ImageName }}"
        quiet: true

    # discard=on: hands the freed blocks back to the thin pool
    - name: Trim the disk
      ansible.builtin.command: fstrim /
      changed_when: false

    # healthy != ready
    - name: Check login health through edge
      ansible.builtin.uri:
        url: "https://auth.{{ domain }}/-/health/ready/"
        status_code: [200, 204]
      register: authentik_ready
      until: authentik_ready.status in [200, 204]
      retries: "{{ authentik_ready_retries }}"
      delay: "{{ authentik_ready_delay }}"
      delegate_to: localhost
      become: false
