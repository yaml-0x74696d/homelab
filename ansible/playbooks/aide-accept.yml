---
# review what changed since the baseline and accept it, one host at a time:
#   ansible-playbook playbooks/aide-accept.yml -l pod-2
#   ansible-navigator run playbooks/aide-accept.yml -m stdout --pae false -l pod-2   (prompts need stdout, no artifact)
# semaphore has no terminal for the prompt: survey var aide_accept=yes accepts without asking,
# the report stays in the task log. the new hash lands in aide_checksum_dir/<host>.sha256
- name: Accept AIDE changes
  hosts: pod_vms:podman_hosts:proxmox:lxc_containers
  serial: 1
  tasks:
    - name: Verify recorded db hash
      ansible.builtin.include_role:
        name: aide
        tasks_from: verify
        public: true   # exposes the role's dials to the tasks below

    - name: No baseline on {{ inventory_hostname }}
      ansible.builtin.debug:
        msg: "no /var/lib/aide/aide.db, run playbooks/aide.yml first. skipping"
      when: not aide_db.stat.exists

    - name: Skip {{ inventory_hostname }}
      ansible.builtin.meta: end_host
      when: not aide_db.stat.exists

    - name: Diff against baseline on {{ inventory_hostname }}
      ansible.builtin.command: aide --config=/etc/aide/aide.conf --update
      register: aide_update
      failed_when: aide_update.rc >= 14
      changed_when: false
      async: "{{ aide_run_timeout }}"
      poll: "{{ aide_run_poll }}"

    - name: Report for {{ inventory_hostname }}
      ansible.builtin.debug:
        msg: "{{ aide_update.stdout_lines[:aide_report_lines] }}"
      when: aide_update.rc != 0

    - name: Accept on {{ inventory_hostname }}?
      ansible.builtin.pause:
        prompt: "type yes to make this the new baseline for {{ inventory_hostname }}"
      register: aide_answer
      when: aide_update.rc != 0 and aide_accept | default('') != 'yes'

    - name: Swap in new baseline
      ansible.builtin.include_role:
        name: aide
        tasks_from: accept
      when: >-
        aide_update.rc != 0
        and (aide_accept | default('') == 'yes' or aide_answer.user_input | default('') == 'yes')
