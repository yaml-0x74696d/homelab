---
# what pbs backs up on docker-2 (see roles/pbs).
# prometheus tsdb is skipped on purpose — bulky, recomputable, config already in git.
pbs_jobs:
  - { name: grafana, type: sqlite, path: grafana/data/grafana.db }
  - { name: uptime-kuma, type: sqlite, path: uptime-kuma/data/kuma.db, podman: true }
  - { name: homelable, type: sqlite, path: homelable/data/homelab.db }
  - { name: influxdb, type: influx, container: influxdb, data_dir: influxdb/data }

pbs_exclude:
  - dns/pihole/etc-pihole/pihole-FTL.db     # query log, huge + disposable
