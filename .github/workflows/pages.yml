---
name: pages

on:
  push:
    branches: [main]
    paths: [architecture/**]
  workflow_dispatch:

# each job gets only what it needs
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

env:
  LIKEC4_VERSION: "1.60.0"
  NODE_VERSION: "22"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read   # configure-pages reads the site settings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # hash history: pages has no spa fallback, deep links would 404
      - env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}   # via env, not spliced into the script
        run: >
          npx -y "likec4@${LIKEC4_VERSION}" build architecture
          --output architecture/dist
          --base "$BASE_PATH/"
          --use-hash-history
          --title Homelab

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: architecture/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write   # deploy-pages proves the run with an oidc token
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
