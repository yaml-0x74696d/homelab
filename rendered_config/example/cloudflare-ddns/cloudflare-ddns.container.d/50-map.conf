# managed by ansible (roles/podman_app), from apps.yml: cloudflare-ddns / cloudflare-ddns
[Container]
ContainerName=cloudflare-ddns
Image=docker.io/favonia/cloudflare-ddns:latest
AutoUpdate=registry
User=1000:1000
StopTimeout=10
Notify=false
HealthOnFailure=none
NoNewPrivileges=true
ReadOnly=true
DropCapability=ALL
