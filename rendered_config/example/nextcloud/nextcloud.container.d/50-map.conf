# managed by ansible (roles/podman_app), from apps.yml: nextcloud / nextcloud
[Container]
ContainerName=nextcloud
Image=docker.io/library/nextcloud:35-apache
AutoUpdate=registry
Pod=nextcloud.pod
User=0:0
StopTimeout=10
NoNewPrivileges=true

[Unit]
Requires=nextcloud-db.service
After=nextcloud-db.service
Requires=nextcloud-redis.service
After=nextcloud-redis.service

[Service]
ExecStartPre=/usr/bin/ls /srv/nextcloud
ExecStartPre=/usr/bin/findmnt -t cifs /srv/nextcloud
ExecStartPre=/usr/bin/ls /srv/nc-media
ExecStartPre=/usr/bin/findmnt -t cifs /srv/nc-media
ExecStartPre=/usr/bin/ls /srv/nc-documents
ExecStartPre=/usr/bin/findmnt -t cifs /srv/nc-documents
ExecStartPre=/usr/bin/ls /srv/nc-photos
ExecStartPre=/usr/bin/findmnt -t cifs /srv/nc-photos
