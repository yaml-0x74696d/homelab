# static host, http only, traefik terminates tls upstream
server {
    listen       80;
    server_name  _;

    charset      utf-8;
    root         /usr/share/nginx/html;
    index        index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # app versions page (roles/app_versions)
    location /versions/ {
        alias /usr/share/nginx/versions/;
    }
}
