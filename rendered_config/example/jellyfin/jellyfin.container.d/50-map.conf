# managed by ansible (roles/podman_app), from apps.yml: jellyfin / jellyfin
[Container]
ContainerName=jellyfin
Image=docker.io/jellyfin/jellyfin:latest
AutoUpdate=registry
StopTimeout=10
NoNewPrivileges=true

[Service]
ExecStartPre=/usr/bin/ls /srv/media
ExecStartPre=/usr/bin/findmnt -t cifs /srv/media
