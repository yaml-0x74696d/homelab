# managed by ansible (roles/podman_app), from apps.yml: paperless / paperless
[Container]
ContainerName=paperless
Image=ghcr.io/paperless-ngx/paperless-ngx:latest
AutoUpdate=registry
Pod=paperless.pod
User=0:0
StopTimeout=10
NoNewPrivileges=true

[Unit]
Requires=paperless-db.service
After=paperless-db.service
Requires=paperless-redis.service
After=paperless-redis.service

[Service]
ExecStartPre=/usr/bin/ls /srv/documents
ExecStartPre=/usr/bin/findmnt -t cifs /srv/documents
