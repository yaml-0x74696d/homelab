# managed by ansible (roles/podman_app), from apps.yml: authentik / authentik-worker
[Container]
ContainerName=authentik-worker
Image=ghcr.io/goauthentik/server:2026.8.3
AutoUpdate=registry
Pod=authentik.pod
StopTimeout=10
NoNewPrivileges=true

[Unit]
Requires=authentik-db.service
After=authentik-db.service
