# managed by ansible (roles/podman_app), from apps.yml: immich / immich
[Container]
ContainerName=immich
Image=ghcr.io/immich-app/immich-server:release
AutoUpdate=registry
Pod=immich.pod
StopTimeout=10
NoNewPrivileges=true

[Unit]
Requires=immich-db.service
After=immich-db.service
Requires=immich-redis.service
After=immich-redis.service

[Service]
ExecStartPre=/usr/bin/ls /srv/photos
ExecStartPre=/usr/bin/findmnt -t cifs /srv/photos
