global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'pve-hosts'
    static_configs:
      - targets:
          - '192.168.178.101:9100'
          - '192.168.178.102:9100'
          - '192.168.178.103:9100'

  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - '192.168.178.201:9100'
          - 'host.containers.internal:9100'
          - '192.168.178.203:9100'
          - '192.168.178.150:9100'
          - '192.168.178.151:9100'
          - '192.168.178.152:9100'

  - job_name: 'docker-engines'
    static_configs:
      - targets:
          - '192.168.178.201:9323'
          - 'host.containers.internal:9323'
          - '192.168.178.203:9323'

  - job_name: 'iot_sensors'
    scrape_interval: 15s
    static_configs:
      - targets: ['192.168.178.152:9641']
